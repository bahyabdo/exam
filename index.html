<style>
:root{
  --bg1:#eef6ff;--bg2:#f8fafc;--card:#ffffff;--card2:#f1f5f9;
  --bd:#e2e8f0;--tx:#0f172a;--mut:#64748b;
  --a:#4f46e5;--b:#0ea5e9;--c:#8b5cf6;
  --ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--info:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Cairo',system-ui,sans-serif;color:var(--tx);min-height:100vh;padding:18px;
  background:radial-gradient(circle at 12% 12%,rgba(14,165,233,.16),transparent 42%),
             radial-gradient(circle at 88% 18%,rgba(139,92,246,.14),transparent 42%),
             radial-gradient(circle at 50% 90%,rgba(16,185,129,.12),transparent 45%),
             linear-gradient(135deg,var(--bg1),var(--bg2));
}
#app{max-width:1060px;margin:0 auto;transition:filter .15s ease}
.brand-bar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  padding:14px 20px;margin-bottom:20px;background:rgba(255,255,255,.94);
  border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(12px);
  box-shadow:0 8px 25px rgba(15,23,42,.05);
}
.brand{display:flex;align-items:center;gap:12px}
.brand-title{font-size:23px;font-weight:900;background:linear-gradient(90deg,#4f46e5,#0ea5e9,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.4px}
.brand-sub{font-size:12px;color:var(--mut);margin-top:-3px;font-weight:600}
.nav-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-pill{padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:#f8fafc;color:var(--tx);transition:.2s}
.nav-pill:hover,.nav-pill.active{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,.22)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;margin-bottom:16px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
.card-soft{background:linear-gradient(135deg,#f8fafc,#eef6ff);border:1px solid #dbeafe;border-radius:18px;padding:18px;transition:.2s}
.card-soft:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(14,165,233,.12);border-color:#93c5fd}
h1{font-size:26px;font-weight:900;color:#0f172a}h2{font-size:20px;font-weight:800;margin-bottom:12px;color:#1e293b}h3{font-size:16px;font-weight:700;margin-bottom:8px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:1px solid var(--bd);background:#f8fafc;color:var(--tx);padding:10px 18px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#e2e8f0;transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--a),var(--b));border:none;color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.28)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.google{background:#ffffff;color:#1e293b;border:1px solid #cbd5e1;font-weight:800;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.btn.google:hover{background:#f8fafc;border-color:#94a3b8}

.bar{height:9px;border-radius:9px;background:#e2e8f0;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .4s}
.qc{border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;background:#f8fafc}
.codebox{font-size:clamp(48px,11vw,92px);font-weight:900;letter-spacing:.18em;text-align:center;direction:ltr;background:linear-gradient(90deg,#4f46e5,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.qrbox{background:#fff;padding:14px;border-radius:18px;display:inline-block;border:2px solid #e0f2fe;box-shadow:0 8px 20px rgba(14,165,233,.12)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:#475569;font-weight:800;background:#f1f5f9}

.chart-bar{width:100%;max-width:42px;background:linear-gradient(180deg,#0ea5e9,#4f46e5);border-radius:8px 8px 0 0;transition:height .5s;min-height:6px;position:relative}

.chart-lbl{font-size:12px;color:#475569;margin-top:6px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}

.timer{font-weight:900;font-size:22px;direction:ltr;color:#4f46e5}.timer.low{color:var(--bad);animation:bl 1s infinite}@keyframes bl{50%{opacity:.4}}
.center{text-align:center}.big{font-size:56px}
.divider{display:flex;align-items:center;text-align:center;color:var(--mut);font-size:13px;margin:16px 0}.divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid var(--bd)}.divider:not(:empty)::before{margin-left:10px}.divider:not(:empty)::after{margin-right:10px}

.footer-bar{text-align:center;padding:14px;margin-top:22px;font-size:13px;color:var(--mut);font-weight:700}
body.exam,body.exam *{-webkit-user-select:none;user-select:none}body.exam input,body.exam textarea{-webkit-user-select:text;user-select:text}
#wm{position:fixed;inset:0;pointer-events:none;z-index:40}
@media print{body{display:none!important}}
</style>

function getGradeInfo(score, total){
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  if(pct >= 90) return {pct, grade:'ممتاز', status:'ناجح', cls:'b-ok'};
  if(pct >= 80) return {pct, grade:'جيد جداً', status:'ناجح', cls:'b-info'};
  if(pct >= 65) return {pct, grade:'جيد', status:'ناجح', cls:'b-purp'};
  if(pct >= 50) return {pct, grade:'مقبول', status:'ناجح', cls:'b-warn'};
  return {pct, grade:'ضعيف', status:'راسب', cls:'b-bad'};
}

async function fb(path, method='GET', body=null){
  const url = `${FIREBASE_URL}/${path}.json`;
  const opt = {method, headers:{'Content-Type':'application/json'}};
  if(body !== null) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  if(!r.ok) throw new Error('تعذر الاتصال بقاعدة البيانات');
  return r.json();
}

      const u = res.user;

      saveT({id:u.uid, name:u.displayName||'معلم', email:u.email});
      toast('تم تسجيل الدخول بحساب Google بنجاح');
      dash();
    }catch(e){ toast('تعذر الدخول عبر Google: ' + e.message); }
  };

  if($('#rst')) $('#rst').onclick=async(e)=>{
    e.preventDefault();
    const email = $('#em').value.trim();
    if(!email) return toast('اكتب بريدك الإلكتروني في الخانة أعلاه أولاً ثم اضغط استعادة');
    try{
      await auth.sendPasswordResetEmail(email);
      toast('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني!');
    }catch(err){ toast('خطأ: ' + err.message); }
  };

  $('#go').onclick=async()=>{
    try{
      const email=$('#em').value.trim(), pass=$('#pw').value;
      if(!email||!pass) return toast('أدخل البريد الإلكتروني وكلمة المرور');
      if(mode==='reg'){
        const name=$('#nm').value.trim();
        if(!name) return toast('أدخل اسم المعلم');
        const res = await auth.createUserWithEmailAndPassword(email, pass);
        await res.user.updateProfile({displayName: name});
        await fb(`teachers/${res.user.uid}`, 'PUT', {id:res.user.uid, name, email});
        saveT({id:res.user.uid, name, email});
      }else{
        const res = await auth.signInWithEmailAndPassword(email, pass);
        const u = res.user;
        const dbT = await fb(`teachers/${u.uid}`);
        saveT({id:u.uid, name:u.displayName||dbT?.name||'معلم', email:u.email});
      }
      dash();
    }catch(e){ toast('تنبيه: ' + e.message); }
  };
}

async function delEx(id){if(!confirm('هل تريد حذف الاختبار وجميع نتائجه نهائياً؟'))return;await fb(`exams/${id}`,'DELETE');await fb(`attempts/${id}`,'DELETE');toast('تم الحذف');dash();}

/* ============== منشئ الاختبار ============== */
const QT={mcq:'اختيار من متعدد',multi:'متعدد الإجابات',tf:'صح / خطأ',short:'إجابة قصيرة',essay:'مقالي'};
async function builder(id){
  let M = id ? await fb(`exams/${id}`) : {title:'',desc:'',duration:30,shuffleQ:true,shuffleO:true,allowBack:false,showScore:false,rotate:45,questions:[]};
  M.questions = M.questions || [];
  const mk=t=>({id:rid(4),type:t,text:'',points:1,...(t==='mcq'?{options:['',''],correct:0}:t==='multi'?{options:['',''],correct:[]}:t==='tf'?{correct:0}:t==='short'?{correct:''}:{})});
  const draw=()=>{
    show(`<div class="row between" style="margin-bottom:12px"><h1>${id?'✏️ تعديل الاختبار':'🆕 إنشاء اختبار جديد'}</h1><button class="btn" id="bk">→ رجوع</button></div>
    <div class="card"><label>عنوان الاختبار</label><input data-f="title" value="${esc(M.title)}" placeholder="مثال: اختبار منتصف الفصل - نظم التشغيل"><label>تعليمات للطلاب (اختياري)</label><textarea data-f="desc" style="min-height:60px">${esc(M.desc)}</textarea>
      <div class="grid2"><div style="margin-top:8px"><label>مدة الاختبار (بالدقائق)</label><input type="number" min="1" data-f="duration" value="${M.duration}"></div>
        <div style="margin-top:8px"><label>تغيّر كود الدخول تلقائياً كل</label><select data-f="rotate">${[[0,'ثابت (يغيّره المعلم يدوياً)'],[30,'30 ثانية'],[45,'45 ثانية'],[60,'دقيقة واحدة'],[120,'دقيقتان']].map(o=>`<option value="${o[0]}" ${M.rotate==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>
      <div class="row" style="margin-top:14px">${[['shuffleQ','ترتيب عشوائي للأسئلة'],['shuffleO','ترتيب عشوائي للخيارات'],['allowBack','السماح بالرجوع للأسئلة السابقة'],['showScore','إظهار الدرجة للطالب بعد التسليم']].map(c=>`<label class="row" style="margin:0;cursor:pointer"><input type="checkbox" style="width:auto;margin:0" data-f="${c[0]}" ${M[c[0]]?'checked':''}> ${c[1]}</label>`).join('')}</div></div>
    ${M.questions.map((q,i)=>qCard(q,i)).join('')}
    <div class="card"><b>＋ إضافة سؤال جديد:</b><div class="row" style="margin-top:10px">${Object.entries(QT).map(([k,v])=>`<button class="btn sm" data-add="${k}">${v}</button>`).join('')}</div></div>
    <button class="btn pri" id="sv" style="width:100%;font-size:18px;padding:14px">💾 حفظ الاختبار</button>`, 'teacher');
    $('#bk').onclick=dash;
    $('#sv').onclick=async()=>{
      try{
        if(!M.title.trim()) throw new Error('اكتب عنوان الاختبار');
        if(!M.questions.length) throw new Error('أضف سؤالاً واحداً على الأقل');
        const eid = id || rid(6);
        const data = {...M, id:eid, owner:teacher.id, open:M.open||false, created:M.created||Date.now()};
        await fb(`exams/${eid}`, 'PUT', data);
        toast('تم حفظ الاختبار بنجاح');dash();
      }catch(e){toast(e.message)}
    };
  };
  const qCard=(q,i)=>{
    let ed='';
    if(q.type==='mcq'||q.type==='multi')ed=q.options.map((o,k)=>`<div class="row" style="margin:6px 0;flex-wrap:nowrap"><input type="${q.type==='mcq'?'radio':'checkbox'}" name="c${i}" style="width:auto;margin:0" data-ok="${i}:${k}" ${(q.type==='mcq'?q.correct===k:q.correct.includes(k))?'checked':''}><input data-op="${i}:${k}" value="${esc(o)}" placeholder="الخيار ${k+1}">${q.options.length>2?`<button class="btn bad sm" data-ro="${i}:${k}">✕</button>`:''}</div>`).join('')+`<button class="btn sm" data-ao="${i}">＋ إضافة خيار</button>`;
    if(q.type==='tf')ed=`<div class="row" style="margin-top:8px">${['صح','خطأ'].map((l,k)=>`<label class="row" style="margin:0"><input type="radio" name="tf${i}" style="width:auto;margin:0" data-ok="${i}:${k}" ${q.correct===k?'checked':''}> ${l}</label>`).join('')}</div>`;
    if(q.type==='short')ed=`<label>الإجابة النموذجية الصحيحة</label><input data-sh="${i}" value="${esc(q.correct)}">`;
    return `<div class="qc"><div class="row between"><b>سؤال ${i+1} <span class="badge b-info">${QT[q.type]}</span></b><div class="row"><label style="margin:0">الدرجة</label><input type="number" min="1" style="width:72px;margin:0" data-pt="${i}" value="${q.points}">${i?`<button class="btn sm" data-mv="${i}:-1">↑</button>`:''}${i<M.questions.length-1?`<button class="btn sm" data-mv="${i}:1">↓</button>`:''}<button class="btn bad sm" data-dq="${i}">حذف</button></div></div><textarea data-qt="${i}" placeholder="اكتب نص السؤال هنا..." style="min-height:60px">${esc(q.text)}</textarea>${ed}</div>`;
  };
  app.oninput=e=>{const d=e.target.dataset;if(d.f&&e.target.type!=='checkbox')M[d.f]=d.f==='duration'||d.f==='rotate'?+e.target.value:e.target.value;if(d.qt!==undefined)M.questions[d.qt].text=e.target.value;if(d.pt!==undefined)M.questions[d.pt].points=+e.target.value||1;if(d.sh!==undefined)M.questions[d.sh].correct=e.target.value;if(d.op){const[i,k]=d.op.split(':');M.questions[i].options[k]=e.target.value}};
  app.onchange=e=>{const d=e.target.dataset;if(d.f&&e.target.type==='checkbox')M[d.f]=e.target.checked;if(d.ok){const[i,k]=d.ok.split(':').map(Number),q=M.questions[i];if(q.type==='multi'){q.correct=e.target.checked?[...new Set([...q.correct,k])]:q.correct.filter(x=>x!==k)}else q.correct=k}};
  app.onclick=e=>{const d=e.target.dataset;if(d.add){M.questions.push(mk(d.add));draw()}if(d.ao!==undefined){M.questions[d.ao].options.push('');draw()}if(d.ro){const[i,k]=d.ro.split(':').map(Number),q=M.questions[i];q.options.splice(k,1);if(q.type==='mcq'&&q.correct>=q.options.length)q.correct=0;draw()}if(d.dq!==undefined){M.questions.splice(+d.dq,1);draw()}if(d.mv){const[i,s]=d.mv.split(':').map(Number);[M.questions[i],M.questions[i+s]]=[M.questions[i+s],M.questions[i]];draw()}};
  draw();
}

/* ============== الجلسة الحية ============== */
async function live(id){
  clearLoops();
  let ex = await fb(`exams/${id}`);
  const rot = async() => {
    const code = String(Math.floor(100000+Math.random()*900000));
    await fb(`exams/${id}`, 'PATCH', {code, open:true, codeAt:Date.now()});
    ex.code = code; ex.open = true; draw();
  };
  const draw = () => {
    const u = `${location.origin}${location.pathname}?c=${ex.code||''}`;
    show(`<div class="row between" style="margin-bottom:12px"><h1>📡 الجلسة الحية: ${esc(ex.title)}</h1><div class="row"><button class="btn" onclick="results('${id}')">📊 الإحصائيات</button><button class="btn" id="bk">→ رجوع</button></div></div>
    <div class="card center"><span class="badge ${ex.open?'b-ok':'b-bad'}">${ex.open?'الاختبار مفتوح للطلاب الآن':'الاختبار مغلق'}</span>
      ${ex.open?`<div class="codebox">${ex.code}</div><div class="qrbox"><div id="qr"></div></div><p class="mut" style="margin-top:8px">كود الدخول يتغير تلقائياً لمنع مشاركته خارج القاعة</p>${ex.rotate>0?'<div class="bar" style="max-width:340px;margin:12px auto"><div id="rb"></div></div>':''}`:'<p class="mut" style="margin:20px">اضغط "فتح الاختبار" لتوليد كود الدخول ورمز QR</p>'}
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn ${ex.open?'bad':'ok'}" id="tg">${ex.open?'🔒 إغلاق الدخول':'🔓 فتح الاختبار'}</button>
        ${ex.open?'<button class="btn pri" id="nw">🔄 توليد كود جديد فوراً</button>':''}
      </div></div>
    <div class="card"><h2>👥 الطلاب الحاضرون في الجلسة (<span id="cnt">0</span>)</h2><div class="table-wrap" id="st"></div></div>`, 'teacher');
    $('#bk').onclick=dash;
    $('#tg').onclick=async()=>{
      if(ex.open){ await fb(`exams/${id}`,'PATCH',{open:false}); ex.open=false; clearLoops(); draw(); }
      else { await rot(); startTimers(); }
    };
    if($('#nw')) $('#nw').onclick=rot;
    if(ex.open && $('#qr')) new QRCode($('#qr'),{text:u,width:165,height:165});
  };
  const poll = async() => {
    const atts = Object.values(await fb(`attempts/${id}`) || {});
    if($('#cnt')) $('#cnt').textContent = atts.length;
    if($('#st')) $('#st').innerHTML = atts.length ? `<table><tr><th>الطالب</th><th>الرقم الجامعي</th><th>الحالة</th><th>الدرجة</th></tr>${atts.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.sid)}</td><td><span class="badge ${a.status==='submitted'?'b-ok':a.status==='locked'?'b-bad':'b-info'}">${a.status==='submitted'?'تم التسليم':a.status==='locked'?'مقفل (مخالفة)':'يؤدي الاختبار'}</span></td><td>${a.score??'-'} / ${a.total}</td></tr>`).join('')}</table>` : '<p class="mut">بانتظار دخول الطلاب...</p>';
  };
  const startTimers = () => {
    clearLoops();
    if(ex.open && ex.rotate>0){
      let left = ex.rotate;
      loops.push(setInterval(()=>{
        left--; if($('#rb')) $('#rb').style.width=(left/ex.rotate*100)+'%';
        if(left<=0){ left=ex.rotate; rot(); }
      },1000));
    }
    loops.push(setInterval(poll, 3500));
  };
  if(ex.open && !ex.code) await rot(); else draw();
  poll(); startTimers();
}

/* ============== لوحة الإحصائيات والنتائج ============== */
async function results(id){
  clearLoops();
  const ex = await fb(`exams/${id}`);
  const atts = Object.values(await fb(`attempts/${id}`) || {});
  const qs = ex.questions || [];
  const totalPts = qs.reduce((s,q)=>s+(+q.points||1), 0);

  const scoredAtts = atts.filter(a => a.status === 'submitted' || a.status === 'locked');
  const scores = scoredAtts.map(a => Number(a.score || 0)).sort((a,b) => a - b);
  const count = scores.length;
  const mean = count ? (scores.reduce((a,b)=>a+b,0) / count).toFixed(2) : 0;
  const median = count ? (count%2 ? scores[Math.floor(count/2)] : ((scores[count/2-1]+scores[count/2])/2).toFixed(1)) : 0;
  const minS = count ? scores[0] : 0;
  const maxS = count ? scores[count-1] : 0;

  const freq = {};
  scores.forEach(s => freq[s] = (freq[s]||0) + 1);
  let modeVal = '-', maxFreq = 0;
  Object.entries(freq).forEach(([k,v]) => { if(v > maxFreq){ maxFreq = v; modeVal = `${k} (${v} طلاب)`; } });

  const ranked = [...scoredAtts].sort((a,b) => (b.score - a.score) || ((a.finishedAt||0) - (b.finishedAt||0)));
  const firstStudent = ranked[0] ? `${ranked[0].name} (${ranked[0].score}/${totalPts})` : 'لا يوجد';
  const lastStudent = ranked.length ? `${ranked[ranked.length-1].name} (${ranked[ranked.length-1].score}/${totalPts})` : 'لا يوجد';

  const qStats = qs.map((q) => {
    let correctCount = 0;
    scoredAtts.forEach(a => {
      const g = a.graded?.[q.id];
      if(g !== undefined && g >= q.points) correctCount++;
    });
    return {text: q.text, correctCount, total: count, ratio: count ? Math.round((correctCount/count)*100) : 0};
  });
  const hardQuestions = qStats.filter(q => count > 0 && q.ratio < 60).sort((a,b) => a.ratio - b.ratio);
  const maxBar = Math.max(...Object.values(freq), 1);

  show(`<div class="row between" style="margin-bottom:12px"><h1>📊 تحليل النتائج والإحصائيات: ${esc(ex.title)}</h1><div class="row"><button class="btn ok" id="csv">⬇ تصدير Excel/CSV</button><button class="btn" id="bk">→ رجوع</button></div></div>

  <div class="grid4" style="margin-bottom:16px">
    <div class="stat-box"><div class="mut">المتوسط الحسابي</div><div class="stat-val">${mean} / ${totalPts}</div><div class="mut">نقطة</div></div>
    <div class="stat-box"><div class="mut">الوسيط (Median)</div><div class="stat-val">${median} / ${totalPts}</div><div class="mut">نقطة</div></div>
    <div class="stat-box"><div class="mut">النطاق (الأدنى - الأعلى)</div><div class="stat-val">${minS} - ${maxS}</div><div class="mut">من ${totalPts} نقطة</div></div>
    <div class="stat-box"><div class="mut">الدرجة الأكثر تكراراً</div><div class="stat-val" style="font-size:19px">${modeVal}</div><div class="mut">إجمالي المختبرين: ${count}</div></div>
  </div>

  <div class="grid2" style="margin-bottom:16px">
    <div class="card-soft row between"><div><div class="mut">🏆 الطالب الأول (الأعلى درجة)</div><b style="font-size:17px;color:#15803d">${esc(firstStudent)}</b></div><span style="font-size:28px">🥇</span></div>
    <div class="card-soft row between"><div><div class="mut">📉 الطالب الأخير (الأقل درجة)</div><b style="font-size:17px;color:#b91c1c">${esc(lastStudent)}</b></div><span style="font-size:28px">📌</span></div>
  </div>

  <div class="card">
    <h2>📈 توزيع إجمالي النقاط</h2>
    ${count ? `<div class="chart-wrap">${Object.entries(freq).sort((a,b)=>Number(a[0])-Number(b[0])).map(([sc,cnt])=>`
      <div class="chart-col">
        <div class="chart-cnt">${cnt}</div>
        <div class="chart-bar" style="height:${Math.max((cnt/maxBar)*120, 8)}px" title="${cnt} طالب حصل على ${sc}"></div>
        <div class="chart-lbl">${sc}</div>
      </div>`).join('')}</div><div class="center mut" style="margin-top:6px;font-size:12px">النقاط المسجلة (المحور الأفقي) مقابل عدد الطلاب (المحور الرأسي)</div>` : '<p class="mut">لا توجد درجات مسجلة بعد لعرض الرسم البياني.</p>'}
  </div>

  <div class="card">
    <h2>⚠️ الأسئلة الشائعة غير الصائبة (نسبة الإجابة الصحيحة أقل من 60%)</h2>
    ${hardQuestions.length ? hardQuestions.map(q=>`
      <div class="card-soft row between" style="margin-bottom:8px">
        <div style="max-width:75%"><b>${esc(q.text)}</b></div>
        <div><span class="badge b-bad">الإجابات الصحيحة: ${q.correctCount} / ${q.total} (${q.ratio}%)</span></div>
      </div>`).join('') : '<p class="mut">ممتاز! لا توجد أسئلة ذات نسبة خطأ مرتفعة حتى الآن.</p>'}
  </div>

  <div class="card">
    <h2>📋 كشف درجات وتقديرات الطلاب</h2>
    <div class="table-wrap">
    ${atts.length?`<table><tr><th>الطالب</th><th>الرقم الجامعي</th><th>الدرجة</th><th>النسبة</th><th>التقدير</th><th>الحالة</th><th>صائبة / خاطئة</th><th>إجراءات</th></tr>
    ${atts.map((a,i)=>{
      const gi = getGradeInfo(a.score||0, a.total||totalPts);
      let okQ = 0, badQ = 0;
      qs.forEach(q => { const g = a.graded?.[q.id]; if(g !== undefined){ g >= q.points ? okQ++ : badQ++; } });
      return `<tr>
        <td><b>${esc(a.name)}</b></td>
        <td>${esc(a.sid)}</td>
        <td><b>${a.score??'-'} / ${a.total}</b></td>
        <td>${gi.pct}%</td>
        <td><span class="badge ${gi.cls}">${gi.grade}</span></td>
        <td><span class="badge ${a.status==='locked'?'b-bad':gi.cls}">${a.status==='locked'?'مقفل (مخالفة)':gi.status}</span></td>
        <td><span style="color:#15803d;font-weight:700">✔ ${okQ}</span> | <span style="color:#b91c1c;font-weight:700">✖ ${badQ}</span></td>
        <td class="row"><button class="btn sm" data-v="${i}">تفاصيل</button>${a.status==='locked'?`<button class="btn ok sm" data-u="${a.id}">السماح بالعودة</button>`:''}</td>
      </tr>`;
    }).join('')}</table>`:'<p class="mut">لم يتقدم أي طالب للاختبار بعد.</p>'}
    </div>
  </div>`, 'teacher');

  $('#bk').onclick=dash;
  $('#csv').onclick=()=>{
    const rows=[['الاسم','الرقم الجامعي','الدرجة','الدرجة الكلية','النسبة %','التقدير','الحالة','أسئلة صائبة','أسئلة خاطئة','المخالفة'],...atts.map(a=>{
      const gi = getGradeInfo(a.score||0, a.total||totalPts);
      let okQ = 0, badQ = 0;
      qs.forEach(q => { const g = a.graded?.[q.id]; if(g !== undefined){ g >= q.points ? okQ++ : badQ++; } });
      return [a.name,a.sid,a.score??'',a.total,gi.pct+'%',gi.grade,gi.status,okQ,badQ,a.lastViolation||''];
    })];
    const b=new Blob(['\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
    const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`Itqan_${ex.title}.csv`;l.click();
  };
  app.onclick=async e=>{
    const d=e.target.dataset;
    if(d.u){await fb(`attempts/${id}/${d.u}`,'PATCH',{status:'active',locked:false});toast('تم فك القفل');results(id);}
    if(d.v!==undefined){
      const a=atts[+d.v], m=document.createElement('div'); m.className='modal';
      m.innerHTML=`<div><div class="row between"><h2>إجابات الطالب: ${esc(a.name)}</h2><button class="btn sm" id="cl">✕</button></div>
        ${a.lastViolation?`<p class="badge b-bad" style="margin:8px 0">سبب القفل: ${esc(a.lastViolation)}</p>`:''}
        ${qs.map((q,k)=>`<div class="qc"><b>س${k+1}: ${esc(q.text)}</b><p class="mut" style="margin:6px 0">إجابة الطالب: ${esc(fmtAns(q,a.answers?.[q.id]))}</p>
        <div class="row"><label style="margin:0">الدرجة (من ${q.points}):</label><input type="number" step="0.5" min="0" max="${q.points}" style="width:85px;margin:0" data-g="${q.id}" value="${a.graded?.[q.id]??0}"></div></div>`).join('')}
        <button class="btn pri" id="sg" style="width:100%">حفظ التعديل</button></div>`;
      document.body.appendChild(m);$('#cl').onclick=()=>m.remove();
      $('#sg').onclick=async()=>{
        const graded={...a.graded}; m.querySelectorAll('[data-g]').forEach(x=>graded[x.dataset.g]=+x.value||0);
        const score=Object.values(graded).reduce((s,v)=>s+v,0);
        await fb(`attempts/${id}/${a.id}`,'PATCH',{graded,score});
        m.remove();toast('تم تحديث الدرجة');results(id);
      };
    }
  };
}
const fmtAns=(q,v)=>v===undefined||v===null||v===''?'لم يجب':q.type==='mcq'?q.options[v]:q.type==='multi'?(v||[]).map(i=>q.options[i]).join('، '):q.type==='tf'?(v===0?'صح':'خطأ'):v;

/* ============== بوابة الطالب والحماية ============== */
function sJoin(pc=''){
  clearLoops();
  show(`<div style="max-width:450px;margin:2vh auto"><div class="card">
    <h2 class="center" style="margin-top:4px">🎓 دخول الاختبار — Itqan</h2>
    <div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:12px;padding:12px;margin:12px 0;font-size:13px;color:#92400e;font-weight:700">⚠️ تنبيه: يمنع تبديل التبويبات أو تصوير الشاشة أو سحب شريط الإشعارات أثناء الاختبار، وسيتم قفل المحاولة فوراً عند المخالفة.</div>
    <label>كود الدخول (6 أرقام)</label><input id="cd" dir="ltr" maxlength="6" style="font-size:24px;text-align:center;letter-spacing:.2em;font-weight:800" value="${esc(pc)}">
    <label>اسم الطالب الثلاثي</label><input id="nm" placeholder="اكتب اسمك الكامل">
    <label>الرقم الجامعي / رقم الجلوس</label><input id="si" dir="ltr" placeholder="2026001">
    <button class="btn pri" id="st" style="width:100%;margin-top:16px;padding:13px">🚀 بدء الاختبار الآن</button></div></div>`, 'student');
  $('#st').onclick=async()=>{
    try{
      const code=$('#cd').value.trim(), name=$('#nm').value.trim(), sid=$('#si').value.trim();
      if(!code||!name||!sid) return toast('أكمل جميع البيانات أولاً');
      const all = await fb('exams') || {};
      const ex = Object.values(all).find(x => x && x.open && String(x.code) === code);
      if(!ex) return toast('كود الدخول غير صحيح أو انتهت صلاحيته');
      const atts = Object.values(await fb(`attempts/${ex.id}`) || {});
      let att = atts.find(a => a && a.sid === sid);
      if(att && att.status === 'submitted') return toast('لقد قمت بتسليم هذا الاختبار مسبقاً');
      if(att && att.status === 'locked') return toast('تم قفل اختبارك بسبب مخالفة، راجع المعلم');
      if(!att){
        const qs = ex.shuffleQ ? shuffle(ex.questions) : ex.questions;
        const order = qs.map(q=>({id:q.id, opts:(q.type==='mcq'||q.type==='multi')?(ex.shuffleO?shuffle(q.options.map((_,i)=>i)):q.options.map((_,i)=>i)):null}));
        const total = ex.questions.reduce((s,q)=>s+(+q.points||1),0);
        const aid = rid(8);
        att = {id:aid, examId:ex.id, name, sid, status:'active', startedAt:Date.now(), answers:{}, total, order};
        await fb(`attempts/${ex.id}/${aid}`, 'PUT', att);
      }
      startExam(ex, att);
    }catch(e){toast(e.message)}
  };
}

function startExam(ex, att){
  clearLoops();
  const qMap = Object.fromEntries(ex.questions.map(q=>[q.id,q]));
  S = {ex, att, idx:0, ans:{...(att.answers||{})}, done:false, locked:false, fsOk:false};
  document.documentElement.requestFullscreen?.().then(()=>S.fsOk=true).catch(()=>{});
  arm();
  const wm=document.createElement('div');wm.id='wm';
  wm.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='190'><text x='15' y='95' fill='rgba(15,23,42,0.06)' font-family='sans-serif' font-size='15' transform='rotate(-24 150 95)'>Itqan | ${att.name} - ${att.sid}</text></svg>`)}")`;
  document.body.appendChild(wm);

  const render=()=>{
    document.body.classList.add('exam');
    const item = att.order[S.idx], q = qMap[item.id], a = S.ans[q.id];
    let inp='';
    if(q.type==='mcq'||q.type==='multi')inp=item.opts.map(oi=>`<button class="opt ${(q.type==='mcq'?a===oi:(a||[]).includes(oi))?'sel':''}" data-o="${oi}"><i>${q.type==='mcq'?'●':'✓'}</i><span>${esc(q.options[oi])}</span></button>`).join('');
    if(q.type==='tf')inp=[0,1].map(k=>`<button class="opt ${a===k?'sel':''}" data-o="${k}"><i>●</i><span>${k===0?'صح':'خطأ'}</span></button>`).join('');
    if(q.type==='short'||q.type==='essay')inp=`<textarea id="ta" placeholder="اكتب إجابتك هنا...">${esc(a||'')}</textarea>`;
    app.innerHTML=`<div class="card"><div class="row between"><div><b>${esc(ex.title)}</b><div class="mut">${esc(att.name)} (${esc(att.sid)})</div></div><div class="timer" id="tm">--:--</div></div><div class="bar" style="margin-top:10px"><div style="width:${(S.idx+1)/att.order.length*100}%"></div></div></div>
    <div class="card"><div class="row between"><span class="badge b-info">سؤال ${S.idx+1} من ${att.order.length}</span><span class="badge b-warn">${q.points} درجة</span></div><h2 style="margin:14px 0">${esc(q.text)}</h2>${inp}
      <div class="row between" style="margin-top:18px">${ex.allowBack&&S.idx>0?'<button class="btn" id="pv">→ السابق</button>':'<span></span>'}${S.idx<att.order.length-1?'<button class="btn pri" id="nx">التالي ←</button>':'<button class="btn ok" id="sb">✔ تسليم الاختبار</button>'}</div></div>`;
    app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const v=+b.dataset.o;if(q.type==='multi'){const c=new Set(S.ans[q.id]||[]);c.has(v)?c.delete(v):c.add(v);S.ans[q.id]=[...c]}else S.ans[q.id]=v;sync();render()});
    if($('#ta'))$('#ta').oninput=e=>{S.ans[q.id]=e.target.value};
    if($('#pv'))$('#pv').onclick=()=>{sync();S.idx--;render()};
    if($('#nx'))$('#nx').onclick=()=>{sync();S.idx++;render()};
    if($('#sb'))$('#sb').onclick=()=>{if(confirm('هل أنت متأكد من تسليم إجاباتك نهائياً؟'))submit()};
  };
  const sync = () => fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {answers:S.ans}).catch(()=>{});
  const endAt = att.startedAt + ex.duration*60000;
  const tick = () => { const left=Math.max(0,Math.floor((endAt-Date.now())/1000)), el=$('#tm'); if(el){el.textContent=fmtTime(left);el.classList.toggle('low',left<60)} if(left<=0&&!S.done)submit(); };
  render(); tick(); loops.push(setInterval(tick,1000));
}

async function submit(){
  if(!S||S.done)return; S.done=true; clearLoops();
  const {ex, att, ans} = S;
  let score = 0; const graded = {};
  ex.questions.forEach(q => {
    const a = ans[q.id]; let g = 0;
    if(q.type==='mcq'||q.type==='tf'){ if(a===q.correct) g = q.points; }
    else if(q.type==='multi'){ const c=[...(q.correct||[])].sort().join(','), u=[...(a||[])].sort().join(','); if(c&&c===u) g = q.points; }
    else if(q.type==='short'){ if(String(a||'').trim().toLowerCase()===String(q.correct||'').trim().toLowerCase()) g = q.points; }
    graded[q.id] = g; score += g;
  });
  await fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {answers:ans, status:'submitted', finishedAt:Date.now(), score, graded});
  end('submitted', score, att.total);
}

function end(st, sc, tot){
  clearLoops(); document.exitFullscreen?.().catch(()=>{});
  const gi = getGradeInfo(sc||0, tot||1);
  show(`<div class="card center" style="max-width:480px;margin:4vh auto;padding:30px">
    <div class="big">${st==='submitted'?'🎉':'🚫'}</div>
    <h2>${st==='submitted'?'تم تسليم الاختبار بنجاح':'تم قفل الاختبار بسبب مخالفة'}</h2>
    <p class="mut" style="margin:10px 0">${st==='submitted'?'تم حفظ إجاباتك في سجل المعلم بنجاح.':'تم رصد محاولة خروج أو تصوير للشاشة وإبلاغ المعلم فوراً.'}</p>
    ${st==='submitted'&&S.ex.showScore?`<div class="card-soft" style="margin-top:16px"><h3>درجتك: ${sc} من ${tot} (${gi.pct}%)</h3><span class="badge ${gi.cls}" style="font-size:15px;margin-top:6px">التقدير: ${gi.grade} — ${gi.status}</span></div>`:''}
    <button class="btn pri" style="margin-top:20px" onclick="home()">العودة للرئيسية</button>
  </div>`, 'home');
}

async function violation(reason){
  if(!S||S.done||S.locked||Date.now()<S.armAt)return;
  S.locked=true;
  const u = `${FIREBASE_URL}/attempts/${S.ex.id}/${S.att.id}.json`;
  const payload = JSON.stringify({status:'locked', finishedAt:Date.now(), lastViolation:reason});
  try{ fetch(u, {method:'PATCH', body:payload, keepalive:true, headers:{'Content-Type':'application/json'}}); }catch{}
  fb(`attempts/${S.ex.id}/${S.att.id}/violations`, 'POST', {t:Date.now(), r:reason}).catch(()=>{});
  end('locked');
}

function arm(){
  const V=r=>violation(r);
  const blurOn=()=>{if(S&&!S.done)app.style.filter='blur(18px)'};
  S.armAt=Date.now()+600;
  let initW=window.innerWidth,initH=window.innerHeight;

  document.addEventListener('visibilitychange',()=>{if(document.hidden){blurOn();V('ترك الصفحة / تبديل التبويب')}});
  window.addEventListener('blur',()=>{blurOn();V('فقدان التركيز / محاولة تصوير أو فتح قائمة')});
  document.addEventListener('mouseleave',()=>{blurOn();V('خروج المؤشر من نافذة الاختبار')});
  window.addEventListener('resize',()=>{
    if(S&&!S.done&&(Math.abs(window.innerWidth-initW)>120||Math.abs(window.innerHeight-initH)>160)){
      blurOn();V('محاولة تقسيم الشاشة أو تغيير حجم النافذة');
    }
  });
  window.addEventListener('pagehide',()=>V('إغلاق أو تحديث الصفحة'));
  window.addEventListener('beforeunload',e=>{if(S&&!S.done){e.preventDefault();e.returnValue=''}});
  document.addEventListener('fullscreenchange',()=>{if(S.fsOk&&!document.fullscreenElement){blurOn();V('الخروج من وضع ملء الشاشة')}});
  ['contextmenu','copy','cut','paste','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(S&&!S.done)e.preventDefault()}));
  document.addEventListener('keyup',e=>{
    if(e.key==='PrintScreen'||e.keyCode===44){blurOn();try{navigator.clipboard.writeText('')}catch{}V('محاولة تصوير الشاشة')}
  });
  document.addEventListener('keydown',e=>{
    if(!S||S.done)return;const k=e.key.toLowerCase();
    if(e.key==='PrintScreen'||e.keyCode===44||e.metaKey||e.key==='Meta'||e.key==='OS'){
      blurOn();try{navigator.clipboard.writeText('')}catch{}e.preventDefault();return V('محاولة تصوير الشاشة أو فتح قائمة النظام');
    }
    if(e.key==='F12'||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','s'].includes(k))||((e.ctrlKey||e.metaKey)&&['c','v','x','p','s','u','a','f'].includes(k))||(e.altKey&&k==='tab')){
      blurOn();e.preventDefault();V('محاولة استخدام اختصار محظور');
    }
  });
}

const pc = new URLSearchParams(location.search).get('c');
pc ? sJoin(pc) : home();
</script>
