async function fb(path, method='GET', body=null){
  let token = '';
  try{ if(auth.currentUser) token = await auth.currentUser.getIdToken(); }catch{}
  const url = `${FIREBASE_URL}/${path}.json${token ? `?auth=${token}` : ''}`;
  const opt = {method, headers:{'Content-Type':'application/json'}};
  if(body !== null) opt.body = JSON.stringify(body);
  const res = await fetch(url, opt);
  if(!res.ok) throw new Error(`خطأ في الاتصال بقاعدة البيانات (${res.status})`);
  return res.json();
}

function getGradeInfo(sc, tot){
  const pct = tot > 0 ? Math.round((sc / tot) * 100) : 0;
  if(pct >= 85) return {pct, grade:'ممتاز', status:'ناجح', cls:'b-ok'};
  if(pct >= 75) return {pct, grade:'جيد جداً', status:'ناجح', cls:'b-ok'};
  if(pct >= 65) return {pct, grade:'جيد', status:'ناجح', cls:'b-info'};
  if(pct >= 50) return {pct, grade:'مقبول', status:'ناجح', cls:'b-warn'};
  return {pct, grade:'راسب', status:'راسب', cls:'b-bad'};
}

/* ================= حساب المسافة الجغرافية بالمتر (Haversine Formula) ================= */
function calcDistanceMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getCurrentGeo(){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject(new Error('المتصفح لا يدعم تحديد الموقع الجغرافي'));
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy || 0}),
      err => reject(new Error(err.code === 1 ? 'يجب السماح بالوصول إلى الموقع الجغرافي (GPS) للدخول' : 'تعذر تحديد موقعك بدقة، فعّل الـ GPS وحاول مرة أخرى')),
      {enableHighAccuracy: true, timeout: 12000, maximumAge: 0}
    );
  });
}

/* ================= نظام الحفظ المحلي التلقائي واسترجاع المحاولات ================= */
function saveLocalAttempt(exId, attId, data){
  try{ localStorage.setItem(`itqan_rec_${exId}_${attId}`, JSON.stringify({...data, savedAt: Date.now()})); }catch{}
}
function loadLocalAttempt(exId, attId){
  try{ const r = localStorage.getItem(`itqan_rec_${exId}_${attId}`); return r ? JSON.parse(r) : null; }catch{ return null; }
}
function clearLocalAttempt(exId, attId){
  try{ localStorage.removeItem(`itqan_rec_${exId}_${attId}`); }catch{}
}

window.addEventListener('online', async () => {
  try{
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('itqan_rec_')){
        const parts = k.split('_');
        const exId = parts[2], attId = parts[3];
        const data = JSON.parse(localStorage.getItem(k)||'null');
        if(data && exId && attId){
          await fb(`attempts/${exId}/${attId}`, 'PATCH', data).catch(()=>{});
          if(data.status === 'locked' || data.status === 'submitted') localStorage.removeItem(k);
        }
      }
    }
  }catch{}
});

}

async function teacherGoogleLogin(){
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const res = await auth.signInWithPopup(provider);
    user = res.user;
    await processTeacherLogin(user);
  }catch(e){ toast('تعذر تسجيل الدخول بجوجل: ' + e.message); }
}

async function teacherEmailLogin(){
  const email = $('#lgEmail')?.value.trim();
  const pass = $('#lgPass')?.value.trim();
  if(!email || !pass) return toast('أدخل البريد وكلمة المرور أولاً');
  try{
    const res = await auth.signInWithEmailAndPassword(email, pass);
    user = res.user;
    await processTeacherLogin(user);
  }catch(e){ toast('خطأ في البيانات أو الحساب غير موجود: ' + e.message); }
}

async function processTeacherLogin(u){
  const tRef = await fb(`teachers/${u.uid}`);
  if(tRef && tRef.banned){
    await auth.signOut(); user = null;
    return toast('⛔ تم حظر هذا الحساب من قبل إدارة المنصة.');
  }
  await fb(`teachers/${u.uid}`, 'PATCH', {
    id: u.uid,
    name: u.displayName || u.email.split('@')[0],
    email: u.email,
    lastLogin: Date.now()
  });
  dash();
}

async function logout(){
  await auth.signOut(); user = null; impTeacher = null; home();
}

/* ================= دوال قالب Excel واستيراد الأسئلة ================= */
function downloadExcelTemplate(){
  if(typeof XLSX === 'undefined') return toast('مكتبة Excel قيد التحميل، حاول بعد لحظة');
  const rows = [
    ['نص السؤال', 'النوع (mcq/tf/short)', 'خيار 1', 'خيار 2', 'خيار 3', 'خيار 4', 'رقم الإجابة الصحيحة (1-4) أو النص', 'الصعوبة (easy/med/hard)', 'الدرجة', 'تفسير الإجابة (اختياري)'],
    ['ما هو البروتوكول المسؤول عن توزيع عناوين IP تلقائياً في الشبكة؟', 'mcq', 'DNS', 'DHCP', 'HTTP', 'FTP', 2, 'easy', 1, 'بروتوكول DHCP يوزع عناوين IP تلقائياً للأجهزة المتصلة بالشبكة.'],
    ['تستخدم خرائط كارنوف لتبسيط التعبيرات المنطقية في الجبر البوليني.', 'tf', '', '', '', '', 1, 'med', 1, 'نعم، خرائط كارنوف تقلل عدد البوابات المنطقية المطلوبة.'],
    ['اكتب اسم الدالة المستخدمة للطباعة في لغة بايثون', 'short', '', '', '', '', 'print', 'easy', 2, 'دالة print() هي الدالة القياسية للطباعة في Python.']
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الأسئلة');
  XLSX.writeFile(wb, 'Itqan_Questions_Template.xlsx');
  toast('✅ تم تنزيل قالب Excel الجاهز بنجاح');
}

function handleExcelImport(file, ex, renderCallback){
  if(!file) return;
  if(typeof XLSX === 'undefined') return toast('مكتبة Excel غير متوفرة حالياً');
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, {type: 'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ''});
      let added = 0;
      for(let i = 1; i < rows.length; i++){
        const r = rows[i];
        const text = String(r[0]||'').trim();
        if(!text) continue;
        let rawType = String(r[1]||'mcq').trim().toLowerCase();
        const type = ['tf','صح','خطأ','true','false'].includes(rawType) ? 'tf' : ['short','قصيرة','مقالي'].includes(rawType) ? 'short' : 'mcq';
        const opts = [String(r[2]||'').trim(), String(r[3]||'').trim(), String(r[4]||'').trim(), String(r[5]||'').trim()];
        const rawCor = String(r[6]||'1').trim();
        let correct = 0;
        if(type === 'mcq'){
          const idx = parseInt(rawCor, 10);
          correct = (idx >= 1 && idx <= 4) ? idx - 1 : 0;
        } else if(type === 'tf'){
          correct = (rawCor === '2' || rawCor === 'خطأ' || rawCor.toLowerCase() === 'false') ? 1 : 0;
        } else {
          correct = rawCor;
        }
        const rawDiff = String(r[7]||'med').trim().toLowerCase();
        const diff = ['easy','سهل'].includes(rawDiff) ? 'easy' : ['hard','صعب'].includes(rawDiff) ? 'hard' : 'med';
        const points = Math.max(1, parseInt(r[8], 10) || 1);
        const explain = String(r[9]||'').trim();

        ex.questions.push({
          id: rid(6), type, text, img: '', points, diff, explain,
          options: type === 'mcq' ? opts : [],
          correct
        });
        added++;
      }
      if(added > 0){
        toast(`🎉 تم استيراد (${added}) سؤال بنجاح من الملف!`);
        renderCallback();
      } else {
        toast('⚠️ لم يتم العثور على أسئلة صالحة في الملف.');
      }
    }catch(err){
      toast('❌ خطأ في قراءة الملف: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function results(eid){
  if(!user) return teacherLoginPrompt();
  const [ex, attsObj] = await Promise.all([fb(`exams/${eid}`), fb(`attempts/${eid}`)]);
  const atts = Object.values(attsObj || {}).sort((a,b)=>(b.score||0)-(a.score||0));

  const submittedAtts = atts.filter(a => a.status === 'submitted');
  const qStats = (ex.questions||[]).map((q, i) => {
    let shownCnt = 0, correctCnt = 0;
    submittedAtts.forEach(a => {
      const wasInPaper = (a.order || ex.questions).some(item => item.id === q.id);
      if(wasInPaper){
        shownCnt++;
        if((a.graded||{})[q.id] > 0) correctCnt++;
      }
    });
    const diffPct = shownCnt ? Math.round((correctCnt / shownCnt) * 100) : 0;
    return {idx: i+1, text: q.text, diffPct, shownCnt};
  });

  show(`<div class="card row between">
    <div><h2>📊 نتائج وتحليل: ${esc(ex.title)}</h2><span class="mut">إجمالي المختبرين: ${atts.length} | المسلمون: ${submittedAtts.length}</span></div>
    <div class="row">
      <button class="btn ok sm" id="expXlBtn">📥 تصدير كشف الدرجات Excel</button>
      <button class="btn" onclick="dash()">رجوع</button>
    </div>
  </div>
  <div class="card">
    <h3>📋 كشف درجات الطلاب</h3>
    <div class="table-wrap">
      <table>
        <tr><th>الترتيب</th><th>اسم الطالب</th><th>الرقم</th><th>الدرجة</th><th>التقدير</th><th>زمن الحل</th><th>الحالة / المخالفات</th><th>ورقة الإجابة</th></tr>
        ${atts.map((a, i) => {
          const gi = getGradeInfo(a.score||0, a.total||1);
          const qCount = (a.order || ex.questions || []).length;
          const durSec = (a.finishedAt && a.startedAt) ? Math.max(1, Math.floor((a.finishedAt - a.startedAt) / 1000)) : null;
          const isAnomaly = durSec !== null && a.status === 'submitted' && durSec < (qCount * 3);
          const durStr = durSec !== null ? (durSec < 60 ? `${durSec} ثانية` : `${Math.floor(durSec/60)} د و ${durSec%60} ث`) : '—';
          return `<tr>
            <td><b>#${i+1}</b></td>
            <td>${esc(a.name)}</td>
            <td dir="ltr">${esc(a.sid)}</td>
            <td><b>${a.score??0} / ${a.total}</b> (${gi.pct}%)</td>
            <td><span class="badge ${gi.cls}">${gi.grade}</span></td>
            <td>${isAnomaly ? `<span class="badge b-bad" title="حل سريع جداً مقارنة بعدد الأسئلة">⚡ ${durStr}</span>` : durStr}</td>
            <td>${a.status==='submitted'?'<span class="badge b-ok">مكتمل</span>':`<span class="badge b-bad">مقفل: ${esc(a.lastViolation||'مخالفة')}</span>`}</td>
            <td><button class="btn sm" onclick="printStudentPaper('${eid}','${a.id}')">🖨️ ورقة الطالب</button></td>
          </tr>`;
        }).join('')}
      </table>
    </div>
  </div>
  <div class="card">
    <h3>📈 تحليل معامل سهولة وصعوبة الأسئلة (Item Analysis)</h3>
    <div class="table-wrap">
      <table>
        <tr><th>السؤال</th><th>مرات الظهور</th><th>نسبة الإجابة الصحيحة</th><th>التقييم الإحصائي</th></tr>
        ${qStats.map(s => `<tr>
          <td><b>س${s.idx}:</b> ${esc(s.text.slice(0,60))}...</td>
          <td>${s.shownCnt} طالب</td>
          <td><b>${s.diffPct}%</b></td>
          <td>${s.shownCnt===0?'<span class="badge">لم يُختبر</span>':s.diffPct>80?'<span class="badge b-ok">سهل جداً</span>':s.diffPct<35?'<span class="badge b-bad">صعب / يحتاج مراجعة</span>':'<span class="badge b-info">متوازن وممتاز</span>'}</td>
        </tr>`).join('')}
      </table>
    </div>
  </div>`, 'teacher');

  $('#expXlBtn').onclick = () => {
    if(typeof XLSX === 'undefined') return toast('مكتبة Excel قيد التحميل');
    const data = [['الترتيب', 'اسم الطالب', 'الرقم الجامعي', 'الدرجة', 'الدرجة الكلية', 'النسبة %', 'التقدير', 'زمن الحل (ثانية)', 'الحالة']];
    atts.forEach((a, i) => {
      const gi = getGradeInfo(a.score||0, a.total||1);
      const durSec = (a.finishedAt && a.startedAt) ? Math.max(1, Math.floor((a.finishedAt - a.startedAt) / 1000)) : '';

async function printStudentPaper(eid, aid){
  const [ex, att] = await Promise.all([fb(`exams/${eid}`), fb(`attempts/${eid}/${aid}`)]);
  const qMap = Object.fromEntries((ex.questions||[]).map(q => [q.id, q]));
  const studentQuestions = (att.order || ex.questions || []).map(it => qMap[it.id]).filter(Boolean);
  const w = window.open('', '_blank', 'width=850,height=700');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>ورقة إجابة - ${esc(att.name)}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Cairo',sans-serif;padding:24px;color:#0f172a} .box{border:1px solid #cbd5e1;border-radius:10px;padding:12px;margin-bottom:10px} @media print{.np{display:none}}</style></head>
  <body>
    <button class="np" onclick="window.print()" style="padding:8px 18px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-bottom:14px">🖨️ طباعة التقرير</button>
    <h2>ورقة إجابة الطالب — منصة Itqan | إتقان</h2>
    <p><b>الاسم:</b> ${esc(att.name)} | <b>الرقم:</b> ${esc(att.sid)} | <b>الاختبار:</b> ${esc(ex.title)} | <b>الدرجة:</b> ${att.score??0} من ${att.total}</p><hr>
    ${studentQuestions.map((q, i) => {
      const uAns = (att.answers||{})[q.id];
      const uTxt = q.type==='mcq' ? (q.options[uAns]||'لم يجب') : q.type==='tf' ? (uAns===0?'صح':uAns===1?'خطأ':'لم يجب') : (uAns||'لم يجب');
      const cTxt = q.type==='mcq' ? q.options[q.correct] : q.type==='tf' ? (q.correct===0?'صح':'خطأ') : q.correct;
      const ok = ((att.graded||{})[q.id]||0) > 0;
      return `<div class="box">
        <div><b>س${i+1}: ${esc(q.text)}</b> (${ok?'✔ صحيح':'❌ خطأ'})</div>
        <div>إجابة الطالب: <b>${esc(uTxt)}</b> | الإجابة النموذجية: <b style="color:#15803d">${esc(cTxt)}</b></div>
      </div>`;
    }).join('')}
  </body></html>`);
  w.document.close();
}

/* ================= بوابة الطالب: السياج الجغرافي + الجلسة الواحدة + الحماية ================= */
function isSplitScreen(){
  const sw = Math.min(screen.width, screen.height), sh = Math.max(screen.width, screen.height);
  const ww = Math.min(window.innerWidth, window.innerHeight), wh = Math.max(window.innerWidth, window.innerHeight);
  return (ww < sw * 0.72) || (wh < sh * 0.72);
}

function isExtendedScreen(){
  try{ return window.screen && window.screen.isExtended === true; }catch{ return false; }
}

function buildStudentQuestions(ex){
  const all = ex.questions || [];
  const bal = ex.balanced || {};
  const bE = bal.easy || 0, bM = bal.med || 0, bH = bal.hard || 0;
  if(bE + bM + bH > 0){
    const easyPool = shuffle(all.filter(q => (q.diff||'med') === 'easy')).slice(0, bE);
    const medPool  = shuffle(all.filter(q => (q.diff||'med') === 'med')).slice(0, bM);
    const hardPool = shuffle(all.filter(q => (q.diff||'med') === 'hard')).slice(0, bH);
    const combined = [...easyPool, ...medPool, ...hardPool];
    return ex.shuffleQ ? shuffle(combined) : combined;
  }
  return ex.shuffleQ ? shuffle(all) : all;
}

function sJoin(pc=''){
  clearLoops();
  show(`<div style="max-width:450px;margin:2vh auto"><div class="card">
    <h2 class="center" style="margin-top:4px">🎓 دخول الاختبار — Itqan</h2>
    <div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:12px;padding:12px;margin:12px 0;font-size:13px;color:#92400e;font-weight:700">⚠️ تنبيه: أغلق تقسيم الشاشة والنوافذ العائمة والشاشات الخارجية قبل البدء. قد يطلب منك الاختبار تفعيل الموقع الجغرافي (GPS) للتحقق من وجودك داخل القاعة.</div>
    <label>كود الدخول (6 أرقام)</label><input id="cd" dir="ltr" maxlength="6" style="font-size:24px;text-align:center;letter-spacing:.2em;font-weight:800" value="${esc(pc)}">
    <label>اسم الطالب الثلاثي</label><input id="nm" placeholder="اكتب اسمك الكامل">
    <label>الرقم الجامعي / رقم الجلوس</label><input id="si" dir="ltr" placeholder="2026001">
    <button class="btn pri" id="st" style="width:100%;margin-top:16px;padding:13px">🚀 بدء الاختبار الآن</button></div></div>`, 'student');

  $('#st').onclick = async () => {
    document.documentElement.requestFullscreen?.().catch(()=>{});
    try{
      if(isSplitScreen()) return toast('🚫 ممنوع الدخول والشاشة مقسومة أو في نافذة عائمة! أغلق تقسيم الشاشة أولاً.');
      if(isExtendedScreen()) return toast('🚫 تم اكتشاف شاشة خارجية متصلة! افصل الشاشة الثانية قبل البدء.');
      const code=$('#cd').value.trim(), name=$('#nm').value.trim(), sid=$('#si').value.trim();
      if(!code||!name||!sid) return toast('أكمل جميع البيانات أولاً');
      const all = await fb('exams') || {};
      const ex = Object.values(all).find(x => x && x.open && String(x.code) === code);
      if(!ex) return toast('كود الدخول غير صحيح أو انتهت صلاحيته');

      if(ex.geo && ex.geo.enabled && ex.geo.lat && ex.geo.lng){
        toast('📍 جاري التحقق من وجودك داخل نطاق القاعة...');
        const stPos = await getCurrentGeo();
        const dist = calcDistanceMeters(ex.geo.lat, ex.geo.lng, stPos.lat, stPos.lng);
        const accBuffer = Math.min(35, Math.round(stPos.acc || 0));
        const allowedDist = (ex.geo.radius || 60) + accBuffer;
        if(dist > allowedDist){
          return toast(`🚫 عذراً، أنت خارج النطاق الجغرافي لقاعة الاختبار (${Math.round(dist)} متر عن القاعة).`);
        }
      }

      const atts = Object.values(await fb(`attempts/${ex.id}`) || {});
      let att = atts.find(a => a && normSid(a.sid) === normSid(sid));
      if(att && att.status === 'submitted') return toast('لقد قمت بتسليم هذا الاختبار مسبقاً');
      if(att && att.status === 'locked') return toast('تم قفل اختبارك بسبب مخالفة، راجع المعلم');

      const mySessionToken = localStorage.getItem(`itqan_tok_${ex.id}_${normSid(sid)}`) || rid(12);
      if(att && att.sessionToken && att.sessionToken !== mySessionToken){
        await fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {status:'locked', finishedAt:Date.now(), lastViolation:'محاولة دخول مزدوجة من جهاز آخر'});
        return toast('🚫 تم رصد محاولة دخول مزدوجة من جهاز آخر! تم قفل الاختبار وإبلاغ المعلم.');
      }
      localStorage.setItem(`itqan_tok_${ex.id}_${normSid(sid)}`, mySessionToken);

      if(!att){
        const chosenQs = buildStudentQuestions(ex);
        const order = chosenQs.map(q=>({id:q.id, opts:(q.type==='mcq'||q.type==='tf')?(ex.shuffleO?shuffle(q.options.map((_,i)=>i)):q.options.map((_,i)=>i)):null}));
        const total = chosenQs.reduce((s,q)=>s+(+q.points||1),0);
        const aid = rid(8);
        att = {id:aid, examId:ex.id, name, sid, status:'active', startedAt:Date.now(), answers:{}, total, order, sessionToken: mySessionToken};
        await fb(`attempts/${ex.id}/${aid}`, 'PUT', att);
      } else if(!att.sessionToken){
        att.sessionToken = mySessionToken;
        await fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {sessionToken: mySessionToken});
      }
      startExam(ex, att);
    }catch(e){ toast(e.message); }
  };
}

function startExam(ex, att){
  clearLoops();
  if(isSplitScreen() || isExtendedScreen()){ toast('🚫 أغلق وضع تقسيم الشاشة أو الشاشة الخارجية أولاً!'); return sJoin(ex.code||''); }
  const qMap = Object.fromEntries(ex.questions.map(q=>[q.id,q]));
  S = {ex, att, idx:0, ans:{...(att.answers||{})}, done:false, locked:false, fsOk:!!document.fullscreenElement, qLeft: ex.qTimer||0, warned:false, offSince:null, lastMsgId:0};

  const cached = loadLocalAttempt(ex.id, att.id);
  if(cached && cached.answers) S.ans = {...cached.answers, ...S.ans};

  arm();
  const wm = document.createElement('div'); wm.id = 'wm';
  wm.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='310' height='180'><text x='10' y='90' fill='rgba(15,23,42,0.09)' font-family='sans-serif' font-weight='bold' font-size='15' transform='rotate(-22 155 95)'>Itqan | ${att.name} (${att.sid})</text></svg>`)}")`;
  document.body.appendChild(wm);
  loops.push(setInterval(()=>{
    if(wm) wm.style.backgroundPosition = `${Math.floor(Math.random()*220)}px ${Math.floor(Math.random()*160)}px`;
  }, 8000));

  const sync = () => {
    saveLocalAttempt(ex.id, att.id, {answers: S.ans, status: S.locked ? 'locked' : 'active'});
    fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {answers: S.ans})
      .then(() => { const b=$('#netBadge'); if(b){b.className='badge b-ok'; b.textContent='🟢 متصل ومؤمّن';} })
      .catch(() => { const b=$('#netBadge'); if(b){b.className='badge b-warn'; b.textContent='🟠 حفظ محلي (ضعف شبكة)';} });
  };

  const goQ = newIdx => { sync(); S.idx = newIdx; S.qLeft = ex.qTimer || 0; render(); };

  const render = () => {
    document.body.classList.add('exam');
    const item = att.order[S.idx], q = qMap[item.id], a = S.ans[q.id];
    let inp = '';
    if(q.type==='mcq') inp = item.opts.map(oi=>`<button class="opt ${a===oi?'sel':''}" data-o="${oi}"><i>●</i><span>${esc(q.options[oi])}</span></button>`).join('');
    if(q.type==='tf') inp = [0,1].map(k=>`<button class="opt ${a===k?'sel':''}" data-o="${k}"><i>●</i><span>${k===0?'صح':'خطأ'}</span></button>`).join('');
    if(q.type==='short') inp = `<textarea id="ta" placeholder="اكتب إجابتك هنا...">${esc(a||'')}</textarea>`;

    const navDots = att.order.map((it, i) => {
      const hasAns = S.ans[it.id] !== undefined && S.ans[it.id] !== '';
      return `<button class="q-dot ${i===S.idx?'cur':hasAns?'ans':''}" ${ex.allowBack&&!ex.qTimer?`data-jump="${i}"`:'disabled'}>${i+1}</button>`;
    }).join('');

    app.innerHTML = `<div class="card">
      <div class="row between">
        <div><b>${esc(ex.title)}</b><div class="mut">${esc(att.name)} (${esc(att.sid)})</div></div>
        <div class="row">
          <button class="btn sm" id="fPlus" title="تكبير الخط">A+</button>
          <button class="btn sm" id="fMinus" title="تصغير الخط">A-</button>
          <span class="badge b-ok" id="netBadge">🟢 متصل ومؤمّن</span>
          ${ex.qTimer>0?`<span class="badge b-warn" id="qtm">⏱️ السؤال: ${S.qLeft}ث</span>`:''}
          <div class="timer-ring" id="tmRing" style="background:conic-gradient(#4f46e5 100%, var(--bd) 0%)"><span id="tm">--:--</span></div>
        </div>
      </div>
      <div class="q-nav">${navDots}</div>
    </div>
    <div class="card">
      <div class="row between"><span class="badge b-info">سؤال ${S.idx+1} من ${att.order.length}</span><span class="badge b-warn">${q.points} درجة</span></div>
      ${q.img?`<div class="center" style="margin-top:12px"><img src="${esc(q.img)}" style="max-width:100%;max-height:260px;border-radius:14px;border:1px solid var(--bd)"></div>`:''}
      <h2 class="q-text">${esc(q.text)}</h2>${inp}
      <div class="row between" style="margin-top:18px">
        ${ex.allowBack&&!ex.qTimer&&S.idx>0?'<button class="btn" id="pv">→ السابق</button>':'<span></span>'}
        ${S.idx<att.order.length-1?'<button class="btn pri" id="nx">التالي ←</button>':'<button class="btn ok" id="sb">✔ تسليم الاختبار</button>'}
      </div>
    </div>`;

    let curSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--qsize')) || 19;
    $('#fPlus').onclick = () => { curSize = Math.min(28, curSize+2); document.documentElement.style.setProperty('--qsize', curSize+'px'); };
    $('#fMinus').onclick = () => { curSize = Math.max(15, curSize-2); document.documentElement.style.setProperty('--qsize', curSize+'px'); };

    app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ S.ans[q.id]=+b.dataset.o; sync(); render(); });
    app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>goQ(+b.dataset.jump));
    if($('#ta')) $('#ta').oninput = e => { S.ans[q.id]=e.target.value; saveLocalAttempt(ex.id, att.id, {answers:S.ans, status:'active'}); };
    if($('#pv')) $('#pv').onclick = () => goQ(S.idx-1);
    if($('#nx')) $('#nx').onclick = () => goQ(S.idx+1);
    if($('#sb')) $('#sb').onclick = () => { if(confirm('هل أنت متأكد من تسليم إجاباتك نهائياً؟')) submit(); };
    renderMath();
  };

  let extraSec = att.extraSec || 0;
  const totalSec = ex.duration * 60;

  const tick = () => {
    if(S && !S.done && !S.locked && Date.now() > S.armAt){
      if(isSplitScreen()){ app.style.filter='blur(28px)'; violation('استخدام تقسيم الشاشة أو نافذة عائمة أثناء الاختبار'); return; }
      if(isExtendedScreen()){ app.style.filter='blur(28px)'; violation('توصيل شاشة خارجية أو مشاركة الشاشة'); return; }
    }
    if(!navigator.onLine){
      if(!S.offSince) S.offSince = Date.now();
      const offSec = Math.floor((Date.now() - S.offSince) / 1000);
      const remOff = Math.max(0, OFFLINE_GRACE_SEC - offSec);
      app.style.filter = 'blur(26px)';
      toast(`⚠️ انقطع الإنترنت! تم طمس الأسئلة وحفظ إجاباتك... متبقي ${remOff}ث لعودة الشبكة`);
      if(offSec >= OFFLINE_GRACE_SEC && !S.done && !S.locked){
        saveLocalAttempt(ex.id, att.id, {answers:S.ans, status:'locked', lastViolation:`انقطاع الإنترنت لأكثر من ${OFFLINE_GRACE_SEC} ثانية`});
        violation(`انقطاع الإنترنت لأكثر من ${OFFLINE_GRACE_SEC} ثانية`);
        return;
      }
    } else if(S.offSince){
      S.offSince = null; app.style.filter = 'none';
      toast('✅ عاد الإنترنت وتمت مزامنة إجاباتك المحفوظة');
      sync();
    }

    const endAt = att.startedAt + (totalSec + extraSec) * 1000;
    const left = Math.max(0, Math.floor((endAt - Date.now()) / 1000));
    const el = $('#tm'), ring = $('#tmRing');
    if(el && ring){
      el.textContent = fmtTime(left);
      const pct = Math.max(0, Math.min(100, (left / (totalSec + extraSec)) * 100));
      const clr = left < 60 ? '#ef4444' : pct < 30 ? '#f59e0b' : '#4f46e5';
      ring.style.background = `conic-gradient(${clr} ${pct}%, var(--bd) ${pct}%)`;
      ring.classList.toggle('low', left < 60);
    }
    if(ex.qTimer > 0 && !S.done){
      S.qLeft--;
      const qel = $('#qtm'); if(qel) qel.textContent = `⏱️ السؤال: ${Math.max(0,S.qLeft)}ث`;
      if(S.qLeft <= 0){ if(S.idx < att.order.length - 1) goQ(S.idx + 1); else submit(); return; }
    }
    if(left <= 0 && !S.done) submit();
  };

  loops.push(setInterval(async () => {
    if(!S || S.done || S.locked || !navigator.onLine) return;
    try{
      const liveAtt = await fb(`attempts/${ex.id}/${att.id}`);
      if(!liveAtt) return;
      if(liveAtt.status === 'locked'){ S.locked = true; end('locked'); return; }
      if(liveAtt.extraSec && liveAtt.extraSec > extraSec){
        extraSec = liveAtt.extraSec;
        toast('⏱️ قام المعلم بتمديد وقت الاختبار لك!');
      }
      if(liveAtt.teacherMsg && liveAtt.teacherMsg.id > S.lastMsgId){
        S.lastMsgId = liveAtt.teacherMsg.id;
        alert(`📢 رسالة من المعلم:\n\n${liveAtt.teacherMsg.text}`);
      }
      if(liveAtt.forceSubmit){ submit(); }
    }catch{}
  }, 5000));

  render(); tick(); loops.push(setInterval(tick, 1000));
}

async function submit(){
  if(!S || S.done) return; S.done = true; clearLoops();
  const {ex, att, ans} = S;
  const qMap = Object.fromEntries(ex.questions.map(q=>[q.id,q]));
  let score = 0; const graded = {};
  (att.order || ex.questions).forEach(it => {
    const q = qMap[it.id]; if(!q) return;
    const a = ans[q.id]; let g = 0;
    if(q.type==='mcq'||q.type==='tf'){ if(a===q.correct) g = q.points; }
    else if(q.type==='short'){ if(String(a||'').trim().toLowerCase()===String(q.correct||'').trim().toLowerCase()) g = q.points; }
    graded[q.id] = g; score += g;
  });
  const finalPayload = {answers:ans, status:'submitted', finishedAt:Date.now(), score, graded};
  saveLocalAttempt(ex.id, att.id, finalPayload);
  try{
    await fb(`attempts/${ex.id}/${att.id}`, 'PATCH', finalPayload);
    clearLocalAttempt(ex.id, att.id);
  }catch{
    toast('⚠️ ضعف في الشبكة: تم حفظ ورقتك محلياً وستُرفع للمعلم تلقائياً فور عودة الإنترنت.');
  }
  end('submitted', score, att.total);
}

function end(st, sc, tot){
  clearLoops(); document.exitFullscreen?.().catch(()=>{});
  const gi = getGradeInfo(sc||0, tot||1);
  if(st==='submitted' && gi.status==='ناجح' && typeof confetti==='function'){
    confetti({particleCount:90, spread:70, origin:{y:0.6}});
  }
  const qMap = Object.fromEntries((S.ex.questions||[]).map(q=>[q.id,q]));
  const studentQs = (S.att.order || S.ex.questions || []).map(it => qMap[it.id]).filter(Boolean);
  const explainsHtml = (st==='submitted' && S.ex.showScore) ? studentQs.filter(q=>q.explain).map(q=>`
    <div class="qc" style="text-align:right"><b>💡 تفسير (${esc(q.text.slice(0,45))}...):</b><div class="mut">${esc(q.explain)}</div></div>`).join('') : '';

  show(`<div class="card center" style="max-width:560px;margin:4vh auto;padding:30px">
    <div class="big">${st==='submitted'?'🎉':'🚫'}</div>
    <h2>${st==='submitted'?'تم تسليم الاختبار بنجاح':'تم قفل الاختبار بسبب مخالفة'}</h2>
    <p class="mut" style="margin:10px 0">${st==='submitted'?'تم حفظ إجاباتك في سجل المعلم بنجاح.':'تم رصد مخالفة لسياسة أمان الاختبار وحفظ إجاباتك السابقة وإبلاغ المعلم.'}</p>
    ${st==='submitted'&&S.ex.showScore?`<div class="card-soft" style="margin-top:16px">
      <h3>درجتك: ${sc} من ${tot} (${gi.pct}%)</h3>
      <span class="badge ${gi.cls}" style="font-size:15px;margin-top:6px">التقدير: ${gi.grade} — ${gi.status}</span>
      ${gi.status==='ناجح'?`<div style="margin-top:14px"><button class="btn ok sm" id="certBtn">🏅 إصدار شهادة الاجتياز</button></div>`:''}
    </div>`:''}
    ${explainsHtml ? `<div style="margin-top:16px"><h3>📚 ملخص الشرح والتغذية الراجعة</h3>${explainsHtml}</div>` : ''}

  </div>`, 'home');
  if($('#certBtn')) $('#certBtn').onclick = () => downloadCertificate(S.att.name, S.att.sid, S.ex.title, sc, tot, gi);

async function violation(reason){
  if(!S || S.done || S.locked || Date.now() < S.armAt) return;
  if(S.ex.warnOnce && !S.warned){
    S.warned = true;
    S.armAt = Date.now() + 2500;
    app.style.filter = 'none';
    alert(`⚠️ تحذير أخير من نظام المراقبة:\nتم رصد: (${reason}).\nفي المرة القادمة سيتم قفل الاختبار نهائياً!`);
    return;
  }
  S.locked = true;
  saveLocalAttempt(S.ex.id, S.att.id, {answers:S.ans, status:'locked', lastViolation:reason});
  let token = '';
  try{ if(auth.currentUser) token = await auth.currentUser.getIdToken(); }catch{}
  const u = `${FIREBASE_URL}/attempts/${S.ex.id}/${S.att.id}.json${token ? `?auth=${token}` : ''}`;
  const payload = JSON.stringify({answers:S.ans, status:'locked', finishedAt:Date.now(), lastViolation:reason});
  try{ fetch(u, {method:'PATCH', body:payload, keepalive:true, headers:{'Content-Type':'application/json'}}); }catch{}
  end('locked');
}

function arm(){
  const V = r => violation(r);
  const blurOn = () => { if(S && !S.done) app.style.filter = 'blur(28px)'; };
  const blurOff = () => { if(S && !S.done && !S.locked && navigator.onLine) app.style.filter = 'none'; };
  S.armAt = Date.now() + 2000;
  S.lastTouch = Date.now();
  let initW = window.innerWidth, initH = window.innerHeight, topSwipeStart = false;

  ['touchstart','pointerdown','mousedown','keydown'].forEach(ev=>{
    document.addEventListener(ev,()=>{
      if(S && !S.done && !S.locked){ S.lastTouch = Date.now(); blurOff(); }
    },{passive:true});
  });

  loops.push(setInterval(()=>{
    if(!S || S.done || S.locked || Date.now() < S.armAt) return;
    if(document.hidden || !document.hasFocus()){ blurOn(); return V('فتح تطبيق عائم أو فقدان التركيز'); }
    if((Date.now() - S.lastTouch) > 20000){ blurOn(); }
  }, 400));

  window.addEventListener('blur',()=>{
    if(!S || S.done || S.locked || Date.now() < S.armAt) return;
    blurOn(); V('التفاعل مع نافذة عائمة أو تطبيق خارجي');
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ blurOn(); V('ترك الصفحة / تبديل التطبيق'); }
  });
  window.addEventListener('resize',()=>{
    if(S && !S.done && Date.now() > S.armAt && (isSplitScreen() || Math.abs(window.innerWidth-initW)>90 || Math.abs(window.innerHeight-initH)>110)){
      blurOn(); V('محاولة تقسيم الشاشة أو تصغير النافذة');
    }
  });
  document.addEventListener('touchstart',e=>{
    if(!S || S.done || Date.now() < S.armAt) return;
    if(e.touches && e.touches.length >= 3){ blurOn(); return V('محاولة تصوير الشاشة بإيماءة اللمس'); }
    const t = e.touches[0];
    if(!t) return;
    if(t.clientX < 12 || t.clientX > window.innerWidth - 12){ blurOn(); return V('محاولة سحب الشريط الجانبي لفتح نافذة عائمة'); }
    topSwipeStart = (t.clientY < 22);
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(topSwipeStart && e.touches[0] && e.touches[0].clientY > 65){
      topSwipeStart = false; blurOn(); V('محاولة سحب شريط الإشعارات العلوي');
    }
  },{passive:true});

  window.addEventListener('pagehide',()=>V('إغلاق أو تحديث الصفحة'));
  window.addEventListener('beforeunload',e=>{ if(S && !S.done){ e.preventDefault(); e.returnValue=''; } });
  document.addEventListener('fullscreenchange',()=>{
    if(S.fsOk && !document.fullscreenElement){ blurOn(); V('الخروج من وضع ملء الشاشة'); }
  });
  ['contextmenu','copy','cut','paste','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{
    if(S && !S.done){ e.preventDefault(); try{window.getSelection()?.removeAllRanges();}catch{} }
  }));
  document.addEventListener('selectionchange',()=>{
    if(S && !S.done && document.activeElement?.tagName!=='TEXTAREA' && document.activeElement?.tagName!=='INPUT'){
      try{window.getSelection()?.removeAllRanges();}catch{}
    }
  });
  document.addEventListener('keyup',e=>{
    if(e.key==='PrintScreen' || e.keyCode===44){ blurOn(); try{navigator.clipboard.writeText('')}catch{} V('محاولة تصوير الشاشة'); }
  });
  document.addEventListener('keydown',e=>{
    if(!S || S.done) return; const k = e.key.toLowerCase();
    if(e.key==='PrintScreen' || e.keyCode===44 || e.metaKey || e.key==='Meta' || e.key==='OS'){
      blurOn(); try{navigator.clipboard.writeText('')}catch{} e.preventDefault(); return V('محاولة تصوير الشاشة أو فتح قائمة النظام');
    }
    if(e.key==='F12' || ((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','s'].includes(k)) || ((e.ctrlKey||e.metaKey)&&['c','v','x','p','s','u','a','f'].includes(k)) || (e.altKey&&k==='tab')){
      blurOn(); e.preventDefault(); V('محاولة استخدام اختصار محظور');
    }
  });
}

/* ================= التشغيل الأولي ================= */
(async()=>{
  auth.onAuthStateChanged(u => { user = u; });
  try{
    const cfg = await fb('sysConfig');
    if(cfg) sysCfg = {maintenance:!!cfg.maintenance, announcement:cfg.announcement||''};
  }catch{}
  const params = new URLSearchParams(location.search);
  if(params.get('admin') === 'itqan' && realIsRoot()) rootPanel();
  else if(params.get('c')) sJoin(params.get('c'));
  else if(params.get('verify')) show(`<div class="card center" style="max-width:480px;margin:8vh auto;padding:30px"><div class="big">✅</div><h2>وثيقة معتمدة — منصة Itqan</h2><p class="mut">هذه الشهادة صادرة رسمياً من منصة إتقان للاختبارات الرقمية لصاحب الرقم الجامعي: <b>${esc(params.get('verify'))}</b></p><button class="btn pri" style="margin-top:14px" onclick="home()">الانتقال للمنصة</button></div>`, 'home');
  else home();
})();
</script>
