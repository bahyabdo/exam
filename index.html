/* ============== دوال تحديد الموقع الجغرافي (Haversine) + إيقاف وسائط المراقبة ============== */
let activeMediaStreams = [];
function stopProctoringMedia(){
  activeMediaStreams.forEach(st => { try{ st.getTracks().forEach(t => t.stop()); }catch{} });
  activeMediaStreams = [];

function calcDistanceMeters(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function checkStudentGeofence(geo){
  return new Promise((resolve, reject) => {
    if(!geo || !geo.enabled || !geo.lat || !geo.lng) return resolve({ok:true});
    if(!navigator.geolocation) return reject('متصفحك لا يدعم خدمة تحديد الموقع الجغرافي (GPS).');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const dist = calcDistanceMeters(geo.lat, geo.lng, pos.coords.latitude, pos.coords.longitude);
        const gpsBuffer = Math.min(pos.coords.accuracy || 10, 20);
        const allowedRadius = (Number(geo.baseRadius)||30) + (Number(geo.extraRadius)||0) + gpsBuffer;
        if(dist <= allowedRadius) resolve({ok:true, dist:Math.round(dist)});
        else reject(`⛔ أنت خارج نطاق قاعة الاختبار! المسافة الحالية: ${Math.round(dist)} متر (الحد المسموح للقاعة: ${Math.round((Number(geo.baseRadius)||30)+(Number(geo.extraRadius)||0))} متر).`);
      },
      () => reject('⚠️ يجب السماح بالوصول إلى الموقع الجغرافي (GPS) للدخول إلى قاعة الاختبار.'),
      {enableHighAccuracy:true, timeout:10000, maximumAge:0}
    );
  });
}

function getGradeInfo(score, total){
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  if(pct >= 90) return {pct, grade:'ممتاز', status:'ناجح', cls:'b-ok'};
  if(pct >= 80) return {pct, grade:'جيد جداً', status:'ناجح', cls:'b-info'};
  if(pct >= 65) return {pct, grade:'جيد', status:'ناجح', cls:'b-purp'};
  if(pct >= 50) return {pct, grade:'مقبول', status:'ناجح', cls:'b-warn'};
  return {pct, grade:'ضعيف', status:'راسب', cls:'b-bad'};
}
const authReady = new Promise(res => { const un = auth.onAuthStateChanged(() => { un(); res(); }); });
async function fb(path, method='GET', body=null){
  let token = '';
  try{ await authReady; if(auth.currentUser) token = await auth.currentUser.getIdToken(); }catch{}
  const qi = path.indexOf('?');
  const base = qi < 0 ? path : path.slice(0, qi);
  const params = qi < 0 ? [] : [path.slice(qi + 1)];
  if(token) params.push(`auth=${token}`);
  const url = `${FIREBASE_URL}/${base}.json${params.length ? '?' + params.join('&') : ''}`;
  const opt = {method, headers:{'Content-Type':'application/json'}};
  if(body !== null) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  if(!r.ok) throw new Error('تعذر الاتصال بقاعدة البيانات أو صلاحية مرفوضة');
  return r.json();
}

/* ============== معاينة الاختبار كطالب ============== */
async function previewExam(id){
  const ex = await fb(`exams/${id}`);
  const qs = ex.questions || [];
  let idx = 0, ans = {};
  const m = document.createElement('div'); m.className = 'modal';
  const drawP = () => {
    const q = qs[idx], a = ans[q.id];
    let inp = '';
    if(q.type==='mcq'||q.type==='multi') inp = q.options.map((o,oi)=>`<button class="opt ${(q.type==='mcq'?a===oi:(a||[]).includes(oi))?'sel':''}" data-po="${oi}"><i>${q.type==='mcq'?'●':'✓'}</i><span>${esc(o)}</span></button>`).join('');
    if(q.type==='tf') inp = [0,1].map(k=>`<button class="opt ${a===k?'sel':''}" data-po="${k}"><i>●</i><span>${k===0?'صح':'خطأ'}</span></button>`).join('');
    if(q.type==='short'||q.type==='essay') inp = `<textarea placeholder="مساحة إجابة الطالب..."></textarea>`;
    m.innerHTML = `<div>
      <div class="row between" style="margin-bottom:10px"><span class="badge b-purp">👁️ وضع معاينة المعلم (لا تُحفظ بيانات)</span><button class="btn sm" id="clP">✕ إغلاق المعاينة</button></div>
      <div class="row between"><span class="badge b-info">سؤال ${idx+1} من ${qs.length}</span><span class="badge b-warn">${q.points} درجة</span></div>
      ${q.img?`<img src="${esc(q.img)}" style="max-width:100%;max-height:220px;border-radius:12px;margin-top:10px">`:''}
      <h2 style="margin:12px 0">${esc(q.text)}</h2>${inp}
      <div class="row between" style="margin-top:16px">
        ${idx>0?'<button class="btn sm" id="pPrev">→ السابق</button>':'<span></span>'}
        ${idx<qs.length-1?'<button class="btn pri sm" id="pNext">التالي ←</button>':'<button class="btn ok sm" id="clP2">✔ إنهاء المعاينة</button>'}
      </div>
    </div>`;
    m.querySelectorAll('[data-po]').forEach(b=>b.onclick=()=>{const v=+b.dataset.po;if(q.type==='multi'){const c=new Set(ans[q.id]||[]);c.has(v)?c.delete(v):c.add(v);ans[q.id]=[...c]}else ans[q.id]=v;drawP()});
    $('#clP').onclick=()=>m.remove();
    if($('#clP2')) $('#clP2').onclick=()=>m.remove();
    if($('#pPrev')) $('#pPrev').onclick=()=>{idx--;drawP()};
    if($('#pNext')) $('#pNext').onclick=()=>{idx++;drawP()};
  };
  document.body.appendChild(m);
  drawP();
}

  const mk=t=>({id:rid(4),type:t,text:'',img:'',points:1,...(t==='mcq'?{options:['',''],correct:0}:t==='multi'?{options:['',''],correct:[]}:t==='tf'?{correct:0}:t==='short'?{correct:''}:{})});
  const captureTeacherLocation = () => {
    if(!navigator.geolocation) return toast('متصفحك لا يدعم تحديد الموقع الجغرافي');
    toast('📍 جاري التقاط إحداثيات قاعة الاختبار بدقة...');

      pos => {
        M.geofence.lat = Number(pos.coords.latitude.toFixed(6));

        M.geofence.baseRadius = 30;

    try{
      const ext = file.name.split('.').pop().toLowerCase();
      let extracted = [];

        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        rows.forEach((r, idx) => {
          if(!r || !r.length) return;
          const cells = r.map(c => String(c||'').trim()).filter(Boolean);
          if(!cells.length) return;
          if(idx === 0 && /اسم|الرقم|جلوس|كود|name|id/i.test(cells.join(' '))) return;
          if(cells.length >= 2){
            const isFirstNum = /^[\d٠-٩]+$/.test(cells[0]);
            extracted.push({sid: isFirstNum ? cells[0] : cells[1], name: isFirstNum ? cells[1] : cells[0]});
          } else {

          }
        });
      } else if(ext === 'docx'){

            const numMatch = line.match(/[\d٠-٩]{2,}/);
            if(numMatch) extracted.push({sid: numMatch[0], name: line.replace(numMatch[0],'').trim()});
            else extracted.push({sid: line, name: ''});
          }
        });
      } else {
        return toast('صيغة غير مدعومة. ارفع ملف Excel (.xlsx / .csv) أو Word (.docx)');

    if(q.type==='tf')ed=`<div class="row" style="margin-top:8px">${['صح','خطأ'].map((l,k)=>`<label class="row" style="margin:0"><input type="radio" name="tf${i}" style="width:auto;margin:0" data-ok="${i}:${k}" ${q.correct===k?'checked':''}> ${l}</label>`).join('')}</div>`;
    if(q.type==='short')ed=`<label>الإجابة النموذجية الصحيحة</label><input data-sh="${i}" value="${esc(q.correct)}">`;
    return `<div class="qc"><div class="row between"><b>سؤال ${i+1} <span class="badge b-info">${QT[q.type]}</span></b><div class="row"><label style="margin:0">الدرجة</label><input type="number" min="1" style="width:68px;margin:0" data-pt="${i}" value="${q.points}"><button class="btn sm" data-svb="${i}" title="حفظ في بنك الأسئلة الشخصي الدائم">⭐ حفظ بالبنك</button>${i?`<button class="btn sm" data-mv="${i}:-1">↑</button>`:''}${i<M.questions.length-1?`<button class="btn sm" data-mv="${i}:1">↓</button>`:''}<button class="btn bad sm" data-dq="${i}">حذف</button></div></div>
    <textarea data-qt="${i}" placeholder="اكتب نص السؤال هنا..." style="min-height:60px">${esc(q.text)}</textarea>
    <input data-qi="${i}" value="${esc(q.img||'')}" placeholder="🖼️ رابط صورة توضيحية للسؤال (اختياري)..." style="font-size:13px;padding:8px 12px">
    ${ed}</div>`;
  };
  app.oninput=e=>{const d=e.target.dataset;if(d.f&&e.target.type!=='checkbox')M[d.f]=['duration','rotate','qTimer'].includes(d.f)?+e.target.value:e.target.value;if(d.qt!==undefined)M.questions[d.qt].text=e.target.value;if(d.qi!==undefined)M.questions[d.qi].img=e.target.value;if(d.pt!==undefined)M.questions[d.pt].points=+e.target.value||1;if(d.sh!==undefined)M.questions[d.sh].correct=e.target.value;if(d.op){const[i,k]=d.op.split(':');M.questions[i].options[k]=e.target.value}};
  app.onchange=e=>{const d=e.target.dataset;if(d.f&&e.target.type==='checkbox'){M[d.f]=e.target.checked;if(d.f==='restrictStudents')draw();}if(d.ok){const[i,k]=d.ok.split(':').map(Number),q=M.questions[i];if(q.type==='multi'){q.correct=e.target.checked?[...new Set([...q.correct,k])]:q.correct.filter(x=>x!==k)}else q.correct=k}};
  app.onclick=async e=>{const d=e.target.dataset;
    if(d.add){M.questions.push(mk(d.add));draw()}
    if(d.ao!==undefined){M.questions[d.ao].options.push('');draw()}
    if(d.ro){const[i,k]=d.ro.split(':').map(Number),q=M.questions[i];q.options.splice(k,1);if(q.type==='mcq'&&q.correct>=q.options.length)q.correct=0;draw()}
    if(d.dq!==undefined){M.questions.splice(+d.dq,1);draw()}
    if(d.mv){const[i,s]=d.mv.split(':').map(Number);[M.questions[i],M.questions[i+s]]=[M.questions[i+s],M.questions[i]];draw()}
    if(d.svb!==undefined){const q=M.questions[+d.svb];if(!q.text.trim())return toast('اكتب نص السؤال أولاً');const bid=rid(6);await fb(`qbank/${curT.id}/${bid}`,'PUT',{...q,id:bid});toast('⭐ تم حفظ السؤال في بنك الأسئلة الشخصي الدائم (لن يُحذف بحذف الاختبار)');}
  };
  draw();
}
/* ============== الاختبار (مع إظهار الرابط المباشر وزر النسخ) ============== */
async function live(id){
  clearLoops();
  let ex = await fb(`exams/${id}`);
  await fb(`exams/${id}`, 'PATCH', {lastUsed:Date.now()}).catch(()=>{});
  const rot = async() => {
    const code = String(Math.floor(100000+Math.random()*900000));
    await fb(`exams/${id}`, 'PATCH', {code, open:true, codeAt:Date.now(), lastUsed:Date.now()});
    ex.code = code; ex.open = true; draw();
  };
  const draw = () => {
    const u = `${location.origin}${location.pathname}?c=${ex.code||''}`;
    show(`<div class="row between" style="margin-bottom:12px"><h1>📡 الاختبار: ${esc(ex.title)}</h1><div class="row"><button class="btn" onclick="results('${id}')">📊 النتائج</button><button class="btn" id="bk">→ رجوع</button></div></div>
    <div class="card center"><span class="badge ${ex.open?'b-ok':'b-bad'}">${ex.open?'الاختبار مفتوح للطلاب الآن':'الاختبار مغلق'}</span>
      ${ex.restrictStudents?` <span class="badge b-purp">🔒 الدخول مقيّد بالكشف (${(ex.allowedList||[]).length} طالب)</span>`:''}
      ${ex.geofence?.enabled?` <span class="badge b-info">📍 نطاق القاعة: ${(ex.geofence.baseRadius||30)+(ex.geofence.extraRadius||0)} متر</span>`:''}
      ${ex.antiCam?` <span class="badge b-purp">📷 رصد الكاميرا مفعّل</span>`:''}
      ${ex.antiAudio?` <span class="badge b-purp">🎙️ رصد الصوت مفعّل</span>`:''}
      ${ex.open?`<div class="codebox">${ex.code}</div>
      <div class="qrbox"><div id="qr"></div></div>
      <div style="max-width:500px;margin:14px auto 6px;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span dir="ltr" style="font-size:13.5px;font-weight:800;color:#0ea5e9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u)}</span>
        <button class="btn pri sm" onclick="navigator.clipboard?.writeText('${esc(u)}');toast('تم نسخ رابط الدخول المباشر!')">📋 نسخ الرابط</button>
      </div>
      <p class="mut" style="margin-top:6px">كود الدخول والرابط يتغيران تلقائياً لمنع مشاركتهما خارج القاعة</p>${ex.rotate>0?'<div class="bar" style="max-width:340px;margin:12px auto"><div id="rb"></div></div>':''}`:'<p class="mut" style="margin:20px">اضغط "فتح الاختبار" لتوليد كود الدخول ورمز QR والرابط المباشر</p>'}
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn ${ex.open?'bad':'ok'}" id="tg">${ex.open?'🔒 إغلاق الدخول':'🔓 فتح الاختبار'}</button>
        ${ex.open?'<button class="btn pri" id="nw">🔄 توليد كود ورابط جديد فوراً</button>':''}
      </div></div>
    <div class="card"><h2>👥 الطلاب الحاضرون في الجلسة (<span id="cnt">0</span>)</h2><div class="table-wrap" id="st"></div></div>`, 'teacher');
    $('#bk').onclick=dash;
    $('#tg').onclick=async()=>{
      if(ex.open){ await fb(`exams/${id}`,'PATCH',{open:false}); ex.open=false; clearLoops(); draw(); }
      else { await rot(); startTimers(); }
    };
    if($('#nw')) $('#nw').onclick=rot;
    if(ex.open && $('#qr')) new QRCode($('#qr'),{text:u,width:165,height:165});
  };
  const poll = async() => {
    const atts = Object.values(await fb(`attempts/${id}`) || {});
    if($('#cnt')) $('#cnt').textContent = atts.length;
    if($('#st')) $('#st').innerHTML = atts.length ? `<table><tr><th>الطالب</th><th>الرقم الجامعي</th><th>الحالة</th><th>الدرجة</th></tr>${atts.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.sid)}</td><td><span class="badge ${a.status==='submitted'?'b-ok':a.status==='locked'?'b-bad':'b-info'}">${a.status==='submitted'?'تم التسليم':a.status==='locked'?`مقفل (${esc(a.lastViolation||'مخالفة')})`:'يؤدي الاختبار'}</span></td><td>${a.score??'-'} / ${a.total}</td></tr>`).join('')}</table>` : '<p class="mut">بانتظار دخول الطلاب...</p>';
  };
  const startTimers = () => {
    clearLoops();
    if(ex.open && ex.rotate>0){
      let left = ex.rotate;
      loops.push(setInterval(()=>{
        left--; if($('#rb')) $('#rb').style.width=(left/ex.rotate*100)+'%';
        if(left<=0){ left=ex.rotate; rot(); }
      },1000));
    }
    loops.push(setInterval(() => { if(!document.hidden) poll(); }, 12000));
  };
  if(ex.open && !ex.code) await rot(); else draw();
  poll(); startTimers();
}
/* ============== لوحة النتائج والنتائج + المخطط الدائري + الغائبون ============== */
async function results(id){
  clearLoops();
  const ex = await fb(`exams/${id}`);
  await fb(`exams/${id}`, 'PATCH', {lastUsed:Date.now()}).catch(()=>{});
  const atts = Object.values(await fb(`attempts/${id}`) || {});
  const qs = ex.questions || [];
  const totalPts = qs.reduce((s,q)=>s+(+q.points||1), 0);
  const submittedAtts = atts.filter(a => a.status === 'submitted');
  const scoredAtts = atts.filter(a => a.status === 'submitted' || a.status === 'locked');
  const scores = scoredAtts.map(a => Number(a.score ?? 0)).sort((a,b) => a - b);
  const count = scores.length;
  const mean = count ? (scores.reduce((a,b)=>a+b,0) / count).toFixed(2) : 0;
  const median = count ? (count%2 ? scores[Math.floor(count/2)] : ((scores[count/2-1]+scores[count/2])/2).toFixed(1)) : 0;
  const minS = count ? scores[0] : 0;
  const maxS = count ? scores[count-1] : 0;
  const freq = {};
  scores.forEach(s => freq[s] = (freq[s]||0) + 1);
  let modeVal = '-', maxFreq = 0;
  Object.entries(freq).forEach(([k,v]) => { if(v > maxFreq){ maxFreq = v; modeVal = `${k} (${v} طلاب)`; } });
  const getDuration = a => (a.finishedAt && a.startedAt) ? (a.finishedAt - a.startedAt) : (a.finishedAt || Infinity);
  const fmtDur = a => (a.finishedAt && a.startedAt) ? ` - ${Math.max(1, Math.round((a.finishedAt - a.startedAt)/1000))} ث` : '';
  const ranked = [...submittedAtts].sort((a,b) => (Number(b.score??0) - Number(a.score??0)) || (getDuration(a) - getDuration(b)));
  const firstStudent = ranked[0] ? `${ranked[0].name} (${Number(ranked[0].score??0)}/${totalPts}${fmtDur(ranked[0])})` : 'لا يوجد';
  const lowestRanked = [...scoredAtts].sort((a,b) => (Number(a.score??0) - Number(b.score??0)) || (getDuration(b) - getDuration(a)));
  const lastStudent = lowestRanked[0] ? `${lowestRanked[0].name} (${Number(lowestRanked[0].score??0)}/${totalPts})` : 'لا يوجد';
  const gDist = {ممتاز:0, 'جيد جداً':0, جيد:0, مقبول:0, ضعيف:0};
  scoredAtts.forEach(a => { const gi = getGradeInfo(a.score||0, a.total||totalPts); gDist[gi.grade]++; });
  const totG = Math.max(count, 1);
  const p1 = (gDist['ممتاز']/totG)*100, p2 = p1+(gDist['جيد جداً']/totG)*100, p3 = p2+(gDist['جيد']/totG)*100, p4 = p3+(gDist['مقبول']/totG)*100;
  const donutGrad = count ? `conic-gradient(#10b981 0% ${p1}%, #0ea5e9 ${p1}% ${p2}%, #8b5cf6 ${p2}% ${p3}%, #f59e0b ${p3}% ${p4}%, #ef4444 ${p4}% 100%)` : 'conic-gradient(#cbd5e1 0% 100%)';
  let absentees = [];

  }
  const qStats = qs.map((q) => {
    let correctCount = 0;
    scoredAtts.forEach(a => {
      const g = a.graded?.[q.id];

    });
    return {text: q.text, correctCount, total: count, ratio: count ? Math.round((correctCount/count)*100) : 0};
  });

  const maxBar = Math.max(...Object.values(freq), 1);
  show(`<div class="row between" style="margin-bottom:12px"><h1>📊 تحليل النتائج والنتائج: ${esc(ex.title)}</h1><div class="row"><button class="btn ok" id="csv">⬇ تصدير Excel/CSV</button><button class="btn" id="bk">→ رجوع</button></div></div>
  <div class="grid4" style="margin-bottom:16px">
    <div class="stat-box"><div class="mut">المتوسط الحسابي</div><div class="stat-val">${mean} / ${totalPts}</div><div class="mut">نقطة</div></div>
    <div class="stat-box"><div class="mut">الوسيط (Median)</div><div class="stat-val">${median} / ${totalPts}</div><div class="mut">نقطة</div></div>
    <div class="stat-box"><div class="mut">النطاق (الأدنى - الأعلى)</div><div class="stat-val">${minS} - ${maxS}</div><div class="mut">من ${totalPts} نقطة</div></div>
    <div class="stat-box"><div class="mut">الدرجة الأكثر تكراراً</div><div class="stat-val" style="font-size:19px">${modeVal}</div><div class="mut">المختبرون: ${count}${ex.restrictStudents?` | الغائبون: ${absentees.length}`:''}</div></div>
  </div>
  <div class="grid2" style="margin-bottom:16px">
    <div class="card-soft row between"><div><div class="mut">🏆 الطالب الأول (الأعلى درجة والأسرع)</div><b style="font-size:17px;color:#15803d">${esc(firstStudent)}</b></div><span style="font-size:28px">🥇</span></div>
    <div class="card-soft row between"><div><div class="mut">📉 الطالب الأخير (الأقل درجة)</div><b style="font-size:17px;color:#b91c1c">${esc(lastStudent)}</b></div><span style="font-size:28px">📌</span></div>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>📈 توزيع إجمالي النقاط</h2>

    </div>

          <div style="width:86px;height:86px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center"><b>${count}</b><span class="mut" style="font-size:11px">طالب</span></div>

          <div><span style="color:#f59e0b">●</span> مقبول: <b>${gDist['مقبول']}</b></div>

  </div>
  <div class="card">
    <h2>⚠️ الأسئلة الشائعة غير الصائبة (نسبة الإجابة الصحيحة أقل من 60%)</h2>

        <div><span class="badge b-bad">الإجابات الصحيحة: ${q.correctCount} / ${q.total} (${q.ratio}%)</span></div>
      </div>`).join('') : '<p class="mut">ممتاز! لا توجد أسئلة ذات نسبة خطأ مرتفعة حتى الآن.</p>'}
  </div>
  ${ex.restrictStudents ? `<div class="card">
    <h2>🚫 كشف الطلاب الغائبين عن الاختبار (${absentees.length} طالب)</h2>
    ${absentees.length ? `<div class="row" style="gap:8px">${absentees.map(ab=>`<span class="badge b-warn">${esc(ab.name||'طالب')} (${esc(ab.sid)})</span>`).join('')}</div>` : '<p class="mut">حضر جميع الطلاب المدرجين في الكشف بنسبة 100%!</p>'}

        }
      }
      let att = await fb(`attempts/${ex.id}/${attKey(sid)}`);
      if(att && att.status === 'submitted'){ stopProctoringMedia(); return toast('لقد قمت بتسليم هذا الاختبار مسبقاً'); }
      if(att && att.status === 'locked'){ stopProctoringMedia(); return toast('تم قفل اختبارك بسبب مخالفة، راجع المعلم'); }
      const sessionToken = rid(10);
      if(!att){
        const qs = ex.shuffleQ ? shuffle(ex.questions) : ex.questions;
        const order = qs.map(q=>({id:q.id, opts:(q.type==='mcq'||q.type==='multi')?(ex.shuffleO?shuffle(q.options.map((_,i)=>i)):q.options.map((_,i)=>i)):null}));
        const total = ex.questions.reduce((s,q)=>s+(+q.points||1),0);
        const aid = attKey(sid);
        att = {id:aid, examId:ex.id, name, sid, status:'active', startedAt:Date.now(), consentAt:Date.now(), answers:{}, total, order, sessionToken};

      } else {
        att.sessionToken = sessionToken;
        await fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {sessionToken});
      }
      startExam(ex, att, preCamStream, preAudioStream);
    }catch(e){stopProctoringMedia();toast(e.message)}
  };
}
function startExam(ex, att, camStream=null, audioStream=null){

  if(audioStream && !activeMediaStreams.includes(audioStream)) activeMediaStreams.push(audioStream);
  const qMap = Object.fromEntries(ex.questions.map(q=>[q.id,q]));
  S = {ex, att, idx:0, ans:{...(att.answers||{})}, done:false, locked:false, fsOk:false, qLeft: ex.qTimer||0, audioWarnings:0, noFaceCount:0};
  document.documentElement.requestFullscreen?.().then(()=>S.fsOk=true).catch(()=>{});
  arm();
  // علامة مائية متحركة تحمل اسم الطالب ورقمه والوقت لفضح أي تصوير خارجي
  const wm=document.createElement('div');wm.id='wm';
  const nowStr = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  wm.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='340' height='200'><text x='15' y='95' fill='rgba(15,23,42,0.075)' font-family='sans-serif' font-weight='bold' font-size='15' transform='rotate(-24 150 95)'>Itqan | ${att.name} - ${att.sid} (${nowStr})</text></svg>`)}")`;
  document.body.appendChild(wm);

 // 1. تشغيل المراقبة الذكية بالكاميرا (كشف الهاتف الثاني + التفات الوجه بدقة العينين والأنف + تغطية العدسة)
  if(ex.antiCam && camStream){
    const camBox = document.createElement('div');
    camBox.id = 'proctorCamBox';
    camBox.innerHTML = `<video id="proctorCam" autoplay playsinline muted></video><div id="camStat" style="font-size:10px;font-weight:800;color:#10b981;margin-top:2px">📷 مراقبة نشطة</div>`;
    document.body.appendChild(camBox);
    const vid = $('#proctorCam');
    vid.srcObject = camStream;
    (async()=>{
      try{
        const objModel = (typeof cocoSsd !== 'undefined') ? await cocoSsd.load() : null;
        const faceModel = (typeof blazeface !== 'undefined') ? await blazeface.load() : null;
        let coverStrikes = 0;
        let missingFaceTicks = 0;
        let multiFaceTicks = 0;
        let phoneTicks = 0;
        let turnTicks = 0;
        let camStrikes = 0;
        let lastStrikeAt = 0;
        let camCheckBusy = false;
        let faceBaseline = [];
        let cameraStatus = '📷 مراقبة نشطة';

        const registerCamStrike = (msg) => {
          const now = Date.now();
          if(now - lastStrikeAt < 4000) return;
          lastStrikeAt = now;
          camStrikes++;
          if(camStrikes >= 3){
            return violation(`تكرار مخالفات الكاميرا (3 مرات): ${msg}`);
          }
          toast(`⚠️ مخالفة كاميرا (${camStrikes}/3): ${msg} — في المرة الثالثة سيُغلق الاختبار!`);
          if($('#camStat')){ $('#camStat').textContent = `⚠️ مخالفات: ${camStrikes}/3`; $('#camStat').style.color = '#ef4444'; }
        };

        const checkCover = (v) => {
          const c = document.createElement('canvas'); c.width=64; c.height=48;
          const ctx = c.getContext('2d', {willReadFrequently:true});
          if(!ctx || !v.videoWidth || !v.videoHeight) return false;
          ctx.drawImage(v,0,0,64,48);
          const d = ctx.getImageData(0,0,64,48).data;
          let sum = 0, sqSum = 0, n = 64 * 48;
          for(let i=0;i<d.length;i+=4){
            const lum = (d[i]+d[i+1]+d[i+2])/3;
            sum += lum; sqSum += lum * lum;
          }
          const mean = sum / n;
          if(mean === 0) return false;
          const variance = (sqSum / n) - (mean * mean);
          return (mean < 12 && variance < 15);
        };

        loops.push(setInterval(async()=>{
          if(!S||S.done||S.locked||Date.now()<S.armAt||vid.readyState<2||!vid.videoWidth||camCheckBusy) return;
          const camTrack = camStream.getVideoTracks()[0];
          if(!camTrack || camTrack.readyState !== 'live' || camTrack.muted){
            if($('#camStat')){ $('#camStat').textContent = '⚠️ الكاميرا متوقفة تقنياً'; $('#camStat').style.color = '#d97706'; }
            return;
          }
          camCheckBusy = true;
          try{
            // أ) تغطية العدسة: تأكيد الحالة عبر 3 دورات لتقليل الإنذارات الكاذبة
            if(checkCover(vid)){
              coverStrikes++;
              if(coverStrikes >= 3){ coverStrikes = 0; registerCamStrike('تغطية عدسة الكاميرا'); }
              return;
            } else { coverStrikes = 0; }

            // ب) الهاتف: لا تُسجل مخالفة إلا بعد ظهوره بثقة مرتفعة في 3 دورات متتالية
            if(objModel){
              const preds = await objModel.detect(vid);
              const phone = preds.some(p => p.class === 'cell phone' && p.score > 0.65);
              phoneTicks = phone ? phoneTicks + 1 : 0;
              if(phoneTicks >= 3){
                phoneTicks = 0;
                registerCamStrike('رصد هاتف محمول آخر أمام الكاميرا');
                return;
              }
            }

            // ج) الوجه: تحمّل الاختفاء العابر وتأكيد تعدد الوجوه قبل تسجيل مخالفة

              const faces = await faceModel.estimateFaces(vid, false);
              if(!faces || faces.length === 0){
                missingFaceTicks++;
                multiFaceTicks = 0;
                if(missingFaceTicks >= 4){
                  missingFaceTicks = 0;
                  registerCamStrike('اختفاء الوجه من أمام الكاميرا');
                }
                return;
              }
              missingFaceTicks = 0;
              if(faces.length > 1){
                multiFaceTicks++;
                if(multiFaceTicks >= 3){
                  multiFaceTicks = 0;
                  registerCamStrike('وجود أكثر من شخص أمام الكاميرا');
                }
                return;
              }
              multiFaceTicks = 0;

              const lm = faces[0].landmarks; // [0:عين يمنى, 1:عين يسرى, 2:أنف]
              if(lm && lm.length >= 3){
                const eye1X = lm[0][0], eye2X = lm[1][0], noseX = lm[2][0];
                const eyeDist = Math.abs(eye2X - eye1X);
                const eyesMidX = (eye1X + eye2X) / 2;
                if(eyeDist > 12){
                  // إنشاء خط أساس شخصي من أول 8 قراءات مستقرة بدلاً من افتراض أن المنتصف واحد للجميع
                  const offset = (noseX - eyesMidX) / eyeDist;
                  if(faceBaseline.length < 8){
                    faceBaseline.push(offset);
                    turnTicks = 0;
                  } else {
                    const sorted = [...faceBaseline].sort((a,b)=>a-b);
                    const baseline = (sorted[3] + sorted[4]) / 2;
                    const deviation = Math.abs(offset - baseline);
                    if(deviation > 0.38){
                      turnTicks++;
                      if(turnTicks >= 4){
                        turnTicks = 0;
                        registerCamStrike('الالتفات بالرأس يميناً أو يساراً بعيداً عن الشاشة');
                      }
                    } else {
                      turnTicks = Math.max(0, turnTicks - 2);
                    }
                  }
                }
              }
            }
          }catch(e){
            // أخطاء تحميل/تحليل الإطار لا تُحتسب مخالفة على الطالب
            if($('#camStat')){
              $('#camStat').textContent = '📷 إعادة تهيئة فحص الكاميرا';
              $('#camStat').style.color = '#d97706';
            }
          }finally{
            camCheckBusy = false;
          }
        }, 1200));
      }catch(e){
        if($('#camStat')){
          $('#camStat').textContent = '⚠️ تعذر تشغيل تحليل الكاميرا';
          $('#camStat').style.color = '#d97706';
        }
      }
    })();
  }

  // 2. تشغيل مراقبة الميكروفون الدقيقة (مع معايرة تلقائية لهدوء القاعة + قياس RMS و Peak)
  if(ex.antiAudio && audioStream){
    try{
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume().catch(()=>{});
      const analyser = audioCtx.createAnalyser();
      const mic = audioCtx.createMediaStreamSource(audioStream);
      mic.connect(analyser);
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.25;
      const timeData = new Uint8Array(analyser.fftSize);
      const freqData = new Uint8Array(analyser.frequencyBinCount);
      let talkTicks = 0;
      let baselineSamples = [];
      let noiseFloor = 1.5;
      let warned = false;
      let cooldownUntil = 0;
      let voiceBase = null;
      const MIC_DEBUG = !!window.DEBUG_MIC || /[?&]debugmic=1/.test(location.search);
      const voiceCalib = [];

      loops.push(setInterval(()=>{

        if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

        let sumSq = 0, crossings = 0;
        for(let i=0;i<timeData.length;i++){

        }
        const rms = Math.sqrt(sumSq / timeData.length) * 100;
        const zcr = crossings / timeData.length;

        // مستوى الطاقة في نطاق الصوت البشري (300–3400 هرتز) بمقياس الديسيبل (قيمة 0–255، كل وحدة ≈ 0.27 ديسيبل)
        const binHz = audioCtx.sampleRate / analyser.fftSize;
        let vSum = 0, vCount = 0;

        }

        // معايرة مستوى هدوء القاعة أثناء فترة التهيئة الموجودة أصلاً في المنصة
        if(Date.now() < S.armAt){
          voiceCalib.push(voiceLevel);
          return;
        }
        if(voiceBase === null){
          const sorted = voiceCalib.length ? [...voiceCalib].sort((x,y)=>x-y) : [voiceLevel];
          voiceBase = sorted[Math.floor((sorted.length - 1) * 0.5)];
        }

        // الكلام = ارتفاع واضح (≈ 8 ديسيبل) فوق هدوء القاعة في نطاق الصوت + مستوى صوت فعلي غير ضئيل
        const speechLike = (voiceLevel - voiceBase) >= 18 && rms >= 0.35;
        // تكيّف بطيء مع ضوضاء القاعة (مروحة/تكييف) عندما لا يوجد كلام، حتى لا تحدث إنذارات كاذبة
        if(!speechLike && (voiceLevel - voiceBase) < 15) voiceBase = voiceBase * 0.98 + voiceLevel * 0.02;
        if(MIC_DEBUG){
          let dbg = document.getElementById('micDbg');
          if(!dbg){
            dbg = document.createElement('div'); dbg.id = 'micDbg';
            dbg.style.cssText = 'position:fixed;top:8px;left:8px;z-index:99999;background:#000c;color:#0f0;font:12px/1.5 monospace;padding:8px 10px;border-radius:8px;direction:ltr;white-space:pre';
            document.body.appendChild(dbg);
          }
          const tr = audioStream.getAudioTracks()[0];
          dbg.textContent = 'MIC DEBUG\n' +
            'ctx: ' + audioCtx.state + '\n' +
            'track: ' + (tr ? tr.readyState + (tr.muted ? ' (MUTED)' : '') + (tr.enabled ? '' : ' (DISABLED)') : 'NONE') + '\n' +
            'rms: ' + rms.toFixed(2) + '\n' +
            'voiceLevel: ' + Math.round(voiceLevel) + '  base: ' + Math.round(voiceBase) + '  delta: ' + Math.round(voiceLevel - voiceBase) + '\n' +
            'speechLike: ' + speechLike + '  ticks: ' + talkTicks + '  warnings: ' + (S.audioWarnings || 0);
        }

        if(Date.now() < cooldownUntil){ talkTicks = 0; return; }
        if(speechLike){
          talkTicks++;
          // اشتراط استمرار الكلام عدة ثوانٍ يقلل تأثر النظام بالأصوات القصيرة والعابرة
          if(talkTicks >= 6){
            talkTicks = 0;
            S.audioWarnings = (S.audioWarnings || 0) + 1;
            if(S.audioWarnings >= 3){
              return violation('تكرار رصد نشاط صوتي يشبه الكلام بعد تحذيرين');
            }
            cooldownUntil = Date.now() + 8000;
            toast(`⚠️ تحذير صوتي (${S.audioWarnings}/2): تم رصد نشاط صوتي يشبه الكلام. يُرجى عدم التحدث — في المرة الثالثة سيُغلق الاختبار!`);
          }
        } else {
          talkTicks = Math.max(0, talkTicks - 1);
        }
      }, 450));
    }catch(e){
      // تعذر تشغيل الميكروفون لا يتحول إلى مخالفة تلقائية
      console.warn('تعذر تشغيل مراقبة الميكروفون:', e);
    }
  }
  // 3. التحقق الدوري من قفل الجلسة الواحدة + البقاء داخل النطاق الجغرافي أثناء الاختبار
  loops.push(setInterval(async()=>{
    if(!S||S.done||S.locked) return;
    try{
      const curAtt = await fb(`attempts/${ex.id}/${att.id}`);
      if(curAtt && curAtt.sessionToken && curAtt.sessionToken !== att.sessionToken){
        return violation('محاولة فتح نفس الاختبار من هاتف أو جهاز آخر');

    let inp='';
    if(q.type==='mcq'||q.type==='multi')inp=item.opts.map(oi=>`<button class="opt ${(q.type==='mcq'?a===oi:(a||[]).includes(oi))?'sel':''}" data-o="${oi}"><i>${q.type==='mcq'?'●':'✓'}</i><span>${esc(q.options[oi])}</span></button>`).join('');

    if(q.type==='short'||q.type==='essay')inp=`<textarea id="ta" placeholder="اكتب إجابتك هنا...">${esc(a||'')}</textarea>`;
    const navDots = att.order.map((it, i) => {
      const hasAns = S.ans[it.id] !== undefined && S.ans[it.id] !== '' && (!Array.isArray(S.ans[it.id]) || S.ans[it.id].length > 0);
      return `<button class="q-dot ${i===S.idx?'cur':hasAns?'ans':''}" ${ex.allowBack&&!ex.qTimer?`data-jump="${i}"`:'disabled'}>${i+1}</button>`;
    }).join('');
    app.innerHTML=`<div class="card">
      <div class="row between">
        <div><b>${esc(ex.title)}</b><div class="mut">${esc(att.name)} (${esc(att.sid)})</div></div>
        <div class="row">
          ${ex.qTimer>0?`<span class="badge b-warn" id="qtm" style="font-size:14px">⏱️ السؤال: ${S.qLeft}ث</span>`:''}
          <div class="timer-ring" id="tmRing" style="background:conic-gradient(#4f46e5 100%, var(--bd) 0%)"><span id="tm">--:--</span></div>
        </div>
      </div>
      <div class="q-nav">${navDots}</div>
    </div>
    <div class="card">
      <div class="row between"><span class="badge b-info">سؤال ${S.idx+1} من ${att.order.length}</span><span class="badge b-warn">${q.points} درجة</span></div>
      ${q.img?`<div class="center" style="margin-top:12px"><img src="${esc(q.img)}" style="max-width:100%;max-height:260px;border-radius:14px;border:1px solid var(--bd)"></div>`:''}
      <h2 style="margin:14px 0">${esc(q.text)}</h2>${inp}
      <div class="row between" style="margin-top:18px">
        ${ex.allowBack&&!ex.qTimer&&S.idx>0?'<button class="btn" id="pv">→ السابق</button>':'<span></span>'}
        ${S.idx<att.order.length-1?'<button class="btn pri" id="nx">التالي ←</button>':'<button class="btn ok" id="sb">✔ تسليم الاختبار</button>'}
      </div>
    </div>`;
    app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const v=+b.dataset.o;if(q.type==='multi'){const c=new Set(S.ans[q.id]||[]);c.has(v)?c.delete(v):c.add(v);S.ans[q.id]=[...c]}else S.ans[q.id]=v;sync();render()});
    app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>goQ(+b.dataset.jump));
    if($('#ta'))$('#ta').oninput=e=>{S.ans[q.id]=e.target.value};

    if($('#nx'))$('#nx').onclick=()=>goQ(S.idx+1);

  };
  const sync = () => fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {answers:S.ans}).catch(()=>{});
  const totalSec = ex.duration * 60;
  const endAt = att.startedAt + totalSec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.floor((endAt - Date.now()) / 1000));
    const el = $('#tm'), ring = $('#tmRing');
    if(el && ring){
      el.textContent = fmtTime(left);
      const pct = Math.max(0, Math.min(100, (left / totalSec) * 100));
      const clr = left < 60 ? '#ef4444' : pct < 30 ? '#f59e0b' : '#4f46e5';
      ring.style.background = `conic-gradient(${clr} ${pct}%, var(--bd) ${pct}%)`;
      ring.classList.toggle('low', left < 60);
    }
    if(ex.qTimer > 0 && !S.done){
      S.qLeft--;
      const qel = $('#qtm'); if(qel) qel.textContent = `⏱️ السؤال: ${Math.max(0,S.qLeft)}ث`;
      if(S.qLeft <= 0){
        if(S.idx < att.order.length - 1) goQ(S.idx + 1);
        else submit();
        return;
      }
    }
    if(left <= 0 && !S.done) submit();
  };
  render(); tick(); loops.push(setInterval(tick,1000));
}
async function submit(){
  if(!S||S.done)return; S.done=true; clearLoops();
  const {ex, att, ans} = S;
  let score = 0; const graded = {};
  ex.questions.forEach(q => {
    const a = ans[q.id]; let g = 0;
    if(q.type==='mcq'||q.type==='tf'){ if(a===q.correct) g = q.points; }
    else if(q.type==='multi'){ const c=[...(q.correct||[])].sort().join(','), u=[...(a||[])].sort().join(','); if(c&&c===u) g = q.points; }
    else if(q.type==='short'){ if(String(a||'').trim().toLowerCase()===String(q.correct||'').trim().toLowerCase()) g = q.points; }
    graded[q.id] = g; score += g;
  });
  await fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {answers:ans, status:'submitted', finishedAt:Date.now(), score, graded});
  end('submitted', score, att.total);
}

    <div style="font-size:18px;font-weight:800;color:#4f46e5">منصة Itqan | إتقان للاختبارات الرقمية الذكية والآمنة</div>
    <h1>🏅 شهادة اجتياز وتفوق</h1>
    <p style="font-size:17px;color:#475569">تشهد إدارة المنصة بأن الطالب / الطالبة:</p>
    <h2>${esc(stName)}</h2>
    <p style="font-size:15px;color:#64748b">الرقم الجامعي / الجلوس: <b>${esc(sid)}</b></p>
    <p style="font-size:17px;margin-top:14px">قد اجتاز بنجاح اختبار: <b>«${esc(exTitle)}»</b></p>
    <div class="box">الدرجة المستحقة: <b>${sc} من ${tot}</b> (${gi.pct}%) — التقدير العام: <b style="color:#15803d">${gi.grade}</b></div>
    <p style="font-size:14px;color:#64748b;margin-top:24px">تاريخ الإصدار: ${today} | نظام التقييم الآمن — إتقان</p>
    <button class="no-p" onclick="window.print()" style="margin-top:18px;padding:10px 24px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:15px;cursor:pointer">🖨️ طباعة أو حفظ PDF</button>
  </div></body></html>`);
  w.document.close();
}
function end(st, sc, tot){
  clearLoops(); document.exitFullscreen?.().catch(()=>{});
  const gi = getGradeInfo(sc||0, tot||1);
  if(st==='submitted' && gi.status==='ناجح' && typeof confetti==='function'){
    confetti({particleCount:90, spread:70, origin:{y:0.6}});
  }
  show(`<div class="card center" style="max-width:500px;margin:4vh auto;padding:30px">
    <div class="big">${st==='submitted'?'🎉':'🚫'}</div>
    <h2>${st==='submitted'?'تم تسليم الاختبار بنجاح':'تم قفل الاختبار بسبب مخالفة'}</h2>
    <p class="mut" style="margin:10px 0">${st==='submitted'?'تم حفظ إجاباتك في سجل المعلم بنجاح.':'تم رصد مخالفة أمنية وإبلاغ المعلم فوراً.'}</p>
    ${st==='submitted'&&S.ex.showScore?`<div class="card-soft" style="margin-top:16px">
      <h3>درجتك: ${sc} من ${tot} (${gi.pct}%)</h3>
      <span class="badge ${gi.cls}" style="font-size:15px;margin-top:6px">التقدير: ${gi.grade} — ${gi.status}</span>
      ${gi.status==='ناجح'?`<div style="margin-top:14px"><button class="btn ok sm" id="certBtn">🏅 إصدار شهادة الاجتياز</button></div>`:''}
    </div>`:''}
    <button class="btn pri" style="margin-top:20px" onclick="home()">العودة للرئيسية</button>
  </div>`, 'home');
  if($('#certBtn')) $('#certBtn').onclick = () => downloadCertificate(S.att.name, S.att.sid, S.ex.title, sc, tot, gi);
}
async function violation(reason){
  if(!S||S.done||S.locked||Date.now()<S.armAt)return;
  S.locked=true;
  stopProctoringMedia();
  let token = '';
  try{ if(auth.currentUser) token = await auth.currentUser.getIdToken(); }catch{}
  const u = `${FIREBASE_URL}/attempts/${S.ex.id}/${S.att.id}.json${token ? `?auth=${token}` : ''}`;
  const payload = JSON.stringify({status:'locked', finishedAt:Date.now(), lastViolation:reason});
  try{ fetch(u, {method:'PATCH', body:payload, keepalive:true, headers:{'Content-Type':'application/json'}}); }catch{}
  fb(`attempts/${S.ex.id}/${S.att.id}/violations`, 'POST', {t:Date.now(), r:reason}).catch(()=>{});
  end('locked');
}
function arm(){
  const V=r=>violation(r);
  const blurOn=()=>{if(S&&!S.done)app.style.filter='blur(28px)'};
  S.armAt=Date.now()+2000;
  let initW=window.innerWidth,initH=window.innerHeight;
  loops.push(setInterval(()=>{
    if(!S||S.done||S.locked||Date.now()<S.armAt)return;
    if(document.hidden || !document.hasFocus()){
      blurOn();
      V('فتح تطبيق عائم أو فقدان التركيز أثناء الاختبار');
    }
  },400));
  window.addEventListener('blur',()=>{
    if(!S||S.done||S.locked||Date.now()<S.armAt)return;
    blurOn();
    V('التفاعل مع نافذة عائمة أو تطبيق خارجي');
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){blurOn();V('ترك الصفحة / تبديل التطبيق')}
  });
  window.addEventListener('resize',()=>{
    if(S&&!S.done&&Date.now()>S.armAt&&(isSplitScreen()||Math.abs(window.innerWidth-initW)>90||Math.abs(window.innerHeight-initH)>110)){
      blurOn();V('محاولة تقسيم الشاشة أو تصغير النافذة');
    }
  });
  document.addEventListener('touchstart',e=>{
    if(!S||S.done||Date.now()<S.armAt)return;
    if(e.touches && e.touches.length>=3){
      blurOn();
      return V('محاولة تصوير الشاشة بإيماءة اللمس');
    }
    const t = e.touches[0];
    if(t && (t.clientX < 14 || t.clientX > window.innerWidth - 14)){
      blurOn();
      return V('محاولة سحب الشريط الجانبي لفتح نافذة عائمة');
    }
  },{passive:true});
  window.addEventListener('pagehide',()=>V('إغلاق أو تحديث الصفحة'));
  window.addEventListener('beforeunload',e=>{if(S&&!S.done){e.preventDefault();e.returnValue=''}});
  document.addEventListener('fullscreenchange',()=>{
    if(S.fsOk&&!document.fullscreenElement){blurOn();V('الخروج من وضع ملء الشاشة')}
  });
['contextmenu','copy','cut','paste','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{
  if(S&&!S.done){ e.preventDefault(); try{window.getSelection()?.removeAllRanges();}catch{} }
}));
document.addEventListener('selectionchange',()=>{
  if(S&&!S.done&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='INPUT'){
    try{window.getSelection()?.removeAllRanges();}catch{}
  }
});
  document.addEventListener('keyup',e=>{
    if(e.key==='PrintScreen'||e.keyCode===44){blurOn();try{navigator.clipboard.writeText('')}catch{}V('محاولة تصوير الشاشة')}
  });
  document.addEventListener('keydown',e=>{
    if(!S||S.done)return;const k=e.key.toLowerCase();
    if(e.key==='PrintScreen'||e.keyCode===44||e.metaKey||e.key==='Meta'||e.key==='OS'){
      blurOn();try{navigator.clipboard.writeText('')}catch{}e.preventDefault();return V('محاولة تصوير الشاشة أو فتح قائمة النظام');
    }
    if(e.key==='F12'||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','s'].includes(k))||((e.ctrlKey||e.metaKey)&&['c','v','x','p','s','u','a','f'].includes(k))||(e.altKey&&k==='tab')){
      blurOn();e.preventDefault();V('محاولة استخدام اختصار محظور');
    }
  });
}
(async()=>{
  try{
    const cfg = await fb('sysConfig');
    if(cfg) sysCfg = {maintenance:!!cfg.maintenance, announcement:cfg.announcement||''};
  }catch{}
  const params = new URLSearchParams(location.search);
  if(params.get('admin') === 'itqan' && realIsRoot()) rootPanel();
  else if(params.get('c')) sJoin(params.get('c'));
  else home();
})();
