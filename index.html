:root{

body.dark{

  --bd:#334155;--tx:#f1f5f9;--mut:#94a3b8;--inp:#0f172a;--inp-bd:#475569;

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Cairo',system-ui,sans-serif;color:var(--tx);min-height:100vh;padding:16px;

}
#app{max-width:1100px;margin:0 auto;transition:filter .15s ease}
.brand-bar{
  position:sticky;top:10px;z-index:35;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  padding:12px 20px;margin-bottom:20px;background:var(--nav);
  border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(16px);
  box-shadow:0 10px 30px rgba(15,23,42,.08);
}
.brand{display:flex;align-items:center;gap:12px}
.brand-title{font-size:23px;font-weight:900;background:linear-gradient(90deg,#4f46e5,#0ea5e9,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.4px}
.brand-sub{font-size:12px;color:var(--mut);margin-top:-3px;font-weight:600}
.nav-tabs{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nav-pill{padding:8px 13px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--card2);color:var(--tx);transition:.2s}
.nav-pill:hover,.nav-pill.active{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.nav-pill.root-pill{background:linear-gradient(135deg,#0f172a,#334155);color:#fbbf24;border-color:#475569}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;margin-bottom:16px;box-shadow:0 10px 30px rgba(15,23,42,.05);transition:background .3s,border-color .3s}
.card-soft{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:18px;padding:18px;transition:.25s}
.hero-portal{cursor:pointer;padding:28px;position:relative;overflow:hidden}
.hero-portal:hover{transform:translateY(-6px);box-shadow:0 18px 35px rgba(79,70,229,.18);border-color:#38bdf8}
.hero-portal .ico{font-size:46px;margin-bottom:10px;display:inline-block;transition:transform .25s}
.hero-portal:hover .ico{transform:scale(1.12) rotate(-4deg)}
h1{font-size:25px;font-weight:900}h2{font-size:19px;font-weight:800;margin-bottom:12px}h3{font-size:16px;font-weight:700;margin-bottom:8px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:10px 16px;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{filter:brightness(.95);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--a),var(--b));border:none;color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.28)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.google{background:#ffffff;color:#1e293b;border:1px solid #cbd5e1;font-weight:800;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.btn.ok{background:var(--ok);border:none;color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.25)}
.btn.bad{background:var(--bad);border:none;color:#fff;box-shadow:0 4px 12px rgba(239,68,68,.25)}
.btn.warn{background:var(--warn);border:none;color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
input,textarea,select{width:100%;background:var(--inp);border:1px solid var(--inp-bd);color:var(--tx);padding:11px 14px;border-radius:12px;font-family:inherit;font-size:15px;margin-top:5px;transition:.2s}

label{display:block;font-size:13px;color:var(--mut);margin-top:12px;font-weight:700}

.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat-box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center;box-shadow:0 4px 12px rgba(15,23,42,.03)}

.chart-lbl{font-size:12px;color:var(--mut);margin-top:6px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:14px;z-index:99;box-shadow:0 10px 30px rgba(15,23,42,.3);font-weight:700;max-width:92vw;text-align:center}

.center{text-align:center}.big{font-size:56px}

.avatar-ring{display:inline-block;padding:5px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#0ea5e9,#10b981);margin-bottom:14px;box-shadow:0 10px 25px rgba(79,70,229,.25)}

.footer-bar{text-align:center;padding:14px;margin-top:22px;font-size:13px;color:var(--mut);font-weight:700}
.wl-box{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.35);border-radius:14px;padding:14px;margin-top:12px}
.step-num{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:900;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px}
body.exam,body.exam *{-webkit-user-select:none;user-select:none}body.exam input,body.exam textarea{-webkit-user-select:text;user-select:text}
#wm{position:fixed;inset:0;pointer-events:none;z-index:40}
@media print{body{display:none!important}}
</style>

function getGradeInfo(score, total){
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  if(pct >= 90) return {pct, grade:'ممتاز', status:'ناجح', cls:'b-ok'};
  if(pct >= 80) return {pct, grade:'جيد جداً', status:'ناجح', cls:'b-info'};
  if(pct >= 65) return {pct, grade:'جيد', status:'ناجح', cls:'b-purp'};
  if(pct >= 50) return {pct, grade:'مقبول', status:'ناجح', cls:'b-warn'};
  return {pct, grade:'ضعيف', status:'راسب', cls:'b-bad'};
}

async function fb(path, method='GET', body=null){
  const url = `${FIREBASE_URL}/${path}.json`;
  const opt = {method, headers:{'Content-Type':'application/json'}};
  if(body !== null) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  if(!r.ok) throw new Error('تعذر الاتصال بقاعدة البيانات');
  return r.json();
}

/* ============== تصدير واستيراد الاختبار (HTML Backup) ============== */
function exportExamHtml(ex){
  const cleanEx = {...ex};
  delete cleanEx.owner; delete cleanEx.open; delete cleanEx.code; delete cleanEx.codeAt;
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify(cleanEx))));
  const qPreview = (ex.questions||[]).map((q,i)=>`<div style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:14px;margin:10px 0">
    <b>س${i+1} (${q.points} درجة): ${esc(q.text)}</b>
    ${q.options?`<ul>${q.options.map((o,idx)=>`<li>${esc(o)} ${(q.type==='mcq'?q.correct===idx:(q.correct||[]).includes(idx))?'✅':''}</li>`).join('')}</ul>`:''}
    ${q.type==='tf'?`<p>الإجابة: <b>${q.correct===0?'صح':'خطأ'}</b></p>`:''}
    ${q.type==='short'?`<p>الإجابة النموذجية: <b>${esc(q.correct)}</b></p>`:''}
  </div>`).join('');

  const htmlDoc = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>نسخة اختبار: ${esc(ex.title)} - منصة Itqan</title>
  <style>body{font-family:Tahoma,Arial,sans-serif;max-width:820px;margin:24px auto;padding:20px;background:#f1f5f9;color:#0f172a}
  .box{background:#fff;padding:24px;border-radius:16px;border:1px solid #cbd5e1}h1{color:#1e3a8a}</style></head>
  <body><div class="box"><h1>📘 نسخة اختبار محفوظة — منصة Itqan | إتقان</h1>
  <p><b>عنوان الاختبار:</b> ${esc(ex.title)} | <b>المدة:</b> ${ex.duration} دقيقة | <b>عدد الأسئلة:</b> ${(ex.questions||[]).length}</p>
  <p style="background:#e0f2fe;padding:10px;border-radius:8px;color:#0369a1">💡 يمكنك استعادة هذا الاختبار بالكامل في أي وقت داخل حسابك على منصة <b>Itqan</b> عبر زر <b>(📤 استيراد اختبار HTML)</b>.</p>
  <hr>${qPreview}</div>
  <script id="itqan-exam-data" type="application/json">${payload}<\/script>
  </body></html>`;

  const blob = new Blob([htmlDoc], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Itqan_Backup_${ex.title.replace(/[^\w\u0600-\u06FF]+/g,'_')}.html`;
  a.click();
  toast('تم تنزيل نسخة الاختبار بصيغة HTML على جهازك بنجاح');
}

async function importExamHtml(file){
  try{
    const txt = await file.text();
    const m = txt.match(/<script id="itqan-exam-data" type="application\/json">([\s\S]*?)<\/script>/);
    if(!m) return toast('الملف المحدد لا يحتوي على بيانات اختبار صالحة من منصة Itqan');
    const parsed = JSON.parse(decodeURIComponent(escape(atob(m[1].trim()))));
    if(!parsed.title || !Array.isArray(parsed.questions)) return toast('بنية ملف الاختبار غير مكتملة');
    const newId = rid(6);
    const now = Date.now();
    const restored = {...parsed, id:newId, owner:teacher.id, open:false, created:now, lastUsed:now};
    await fb(`exams/${newId}`, 'PUT', restored);
    toast(`تم استيراد الاختبار "${restored.title}" بنجاح!`);
    dash();
  }catch(e){ toast('تعذر استيراد الملف: ' + e.message); }
}

/* ============== معاينة الاختبار كطالب ============== */
async function previewExam(id){
  const ex = await fb(`exams/${id}`);
  const qs = ex.questions || [];
  let idx = 0, ans = {};
  const m = document.createElement('div'); m.className = 'modal';
  const drawP = () => {
    const q = qs[idx], a = ans[q.id];
    let inp = '';
    if(q.type==='mcq'||q.type==='multi') inp = q.options.map((o,oi)=>`<button class="opt ${(q.type==='mcq'?a===oi:(a||[]).includes(oi))?'sel':''}" data-po="${oi}"><i>${q.type==='mcq'?'●':'✓'}</i><span>${esc(o)}</span></button>`).join('');
    if(q.type==='tf') inp = [0,1].map(k=>`<button class="opt ${a===k?'sel':''}" data-po="${k}"><i>●</i><span>${k===0?'صح':'خطأ'}</span></button>`).join('');
    if(q.type==='short'||q.type==='essay') inp = `<textarea placeholder="مساحة إجابة الطالب..."></textarea>`;
    m.innerHTML = `<div>
      <div class="row between" style="margin-bottom:10px"><span class="badge b-purp">👁️ وضع معاينة المعلم (لا تُحفظ بيانات)</span><button class="btn sm" id="clP">✕ إغلاق المعاينة</button></div>
      <div class="row between"><span class="badge b-info">سؤال ${idx+1} من ${qs.length}</span><span class="badge b-warn">${q.points} درجة</span></div>
      ${q.img?`<img src="${esc(q.img)}" style="max-width:100%;max-height:220px;border-radius:12px;margin-top:10px">`:''}
      <h2 style="margin:12px 0">${esc(q.text)}</h2>${inp}
      <div class="row between" style="margin-top:16px">
        ${idx>0?'<button class="btn sm" id="pPrev">→ السابق</button>':'<span></span>'}
        ${idx<qs.length-1?'<button class="btn pri sm" id="pNext">التالي ←</button>':'<button class="btn ok sm" id="clP2">✔ إنهاء المعاينة</button>'}
      </div>
    </div>`;
    m.querySelectorAll('[data-po]').forEach(b=>b.onclick=()=>{const v=+b.dataset.po;if(q.type==='multi'){const c=new Set(ans[q.id]||[]);c.has(v)?c.delete(v):c.add(v);ans[q.id]=[...c]}else ans[q.id]=v;drawP()});
    $('#clP').onclick=()=>m.remove();
    if($('#clP2')) $('#clP2').onclick=()=>m.remove();
    if($('#pPrev')) $('#pPrev').onclick=()=>{idx--;drawP()};
    if($('#pNext')) $('#pNext').onclick=()=>{idx++;drawP()};
  };
  document.body.appendChild(m);
  drawP();
}

/* ============== لوحة تحكم المعلم + البحث والتصفية + الأرشفة ============== */
async function dash(){
  clearLoops();
  show('<div class="card center mut">جاري تحميل اختباراتك والتحقق من الأرشفة التلقائية...</div>', 'teacher');
  
  const dbT = await fb(`teachers/${teacher.id}`).catch(()=>null);
  if(dbT && dbT.banned){
    await auth.signOut().catch(()=>{}); saveT(null);
    return show('<div class="card center" style="padding:40px"><div class="big">🚫</div><h2>تم إيقاف هذا الحساب من قِبل إدارة المنصة</h2></div>', 'home');
  }

  const all = await fb('exams') || {};
  const myExams = Object.values(all).filter(x => x && x.owner === teacher.id);
  const now = Date.now();
  let autoDeletedCount = 0;

  const activeList = [];
  for(const e of myExams){
    const lastAct = e.lastUsed || e.created || now;
    if((now - lastAct) > FIVE_MONTHS_MS){
      await fb(`exams/${e.id}`, 'DELETE').catch(()=>{});
      await fb(`attempts/${e.id}`, 'DELETE').catch(()=>{});
      autoDeletedCount++;
    } else {
      activeList.push(e);
    }
  }
  if(autoDeletedCount > 0) toast(`تنبيه الصيانة التلقائية: تم حذف ${autoDeletedCount} اختبار قديم مرّ عليه أكثر من 5 أشهر دون استخدام.`);

  const list = activeList.sort((a,b)=>(b.lastUsed||b.created||0)-(a.lastUsed||a.created||0));
  let qFilter = '', statusFilter = 'all';

  const renderDash = () => {
    const filtered = list.filter(e => {
      const matchText = !qFilter || e.title.toLowerCase().includes(qFilter);

    show(`<div class="card"><div class="row between">

        <button class="btn" id="out">خروج</button>
      </div>
    </div>
    <div class="row between" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--bd)">
      <input id="srch" value="${esc(qFilter)}" placeholder="🔍 ابحث في اختباراتك بالاسم..." style="max-width:320px;margin:0">
      <div class="row">
        ${[['all','الكل'],['open','🟢 المفتوحة'],['closed','🔴 المغلقة'],['restricted','🔒 مقيّدة بكشف']].map(([k,lbl])=>`<button class="btn sm ${statusFilter===k?'pri':''}" data-flt="${k}">${lbl}</button>`).join('')}
      </div>
    </div>
    </div>
    <div id="exList">${filtered.length?filtered.map(e=>`<div class="card"><div class="row between">
      <div><h2 style="margin:0">${esc(e.title)}</h2>
        <div class="row" style="margin-top:8px">
          <span class="badge ${e.open?'b-ok':'b-warn'}">${e.open?'🟢 الجلسة مفتوحة':'🔴 الجلسة مغلقة'}</span>
          <span class="badge b-info">${(e.questions||[]).length} سؤال</span>
          <span class="badge b-purp">${e.duration} دقيقة</span>
          ${e.qTimer>0?`<span class="badge b-warn">⏱️ ${e.qTimer} ث/سؤال</span>`:''}
          ${e.restrictStudents?`<span class="badge b-ok">🔒 كشف (${(e.allowedList||[]).length} طالب)</span>`:''}
        </div>
      </div>
      <div class="row">
        <button class="btn pri sm" onclick="live('${e.id}')">▶ الجلسة الحية</button>
        <button class="btn sm" onclick="results('${e.id}')">📊 الإحصائيات</button>
        <button class="btn sm" onclick="previewExam('${e.id}')">👁️ معاينة</button>
        <button class="btn sm" onclick="builder('${e.id}')">✏️ تعديل</button>
        <button class="btn sm" onclick="exportExamHtml(${JSON.stringify(e).replace(/"/g,'"')})">📥 HTML</button>
        <button class="btn bad sm" onclick="delEx('${e.id}')">🗑️</button>
      </div></div></div>`).join(''):'<div class="card center mut" style="padding:40px">لا توجد اختبارات مطابقة للبحث الحالي.</div>'}</div>`, 'teacher');

    $('#nw').onclick=()=>builder();
    $('#impF').onchange=e=>{ if(e.target.files[0]) importExamHtml(e.target.files[0]); };
    $('#out').onclick=async()=>{await auth.signOut().catch(()=>{});saveT(null);home()};
    $('#srch').oninput=e=>{ qFilter=e.target.value.trim().toLowerCase(); renderDash(); $('#srch').focus(); };
    document.querySelectorAll('[data-flt]').forEach(b=>b.onclick=()=>{ statusFilter=b.dataset.flt; renderDash(); });
  };
  renderDash();
}

async function delEx(id){if(!confirm('هل تريد حذف الاختبار وجميع نتائجه نهائياً؟'))return;await fb(`exams/${id}`,'DELETE');await fb(`attempts/${id}`,'DELETE');toast('تم الحذف');dash();}

/* ============== منشئ الاختبار + بنك الأسئلة + مؤقت السؤال + كشف الطلاب ============== */
const QT={mcq:'اختيار من متعدد',multi:'متعدد الإجابات',tf:'صح / خطأ',short:'إجابة قصيرة',essay:'مقالي'};
async function builder(id){
  let M = id ? await fb(`exams/${id}`) : {title:'',desc:'',duration:30,qTimer:0,shuffleQ:true,shuffleO:true,allowBack:false,showScore:false,rotate:45,restrictStudents:false,allowedList:[],questions:[]};
  M.questions = M.questions || [];
  M.allowedList = M.allowedList || [];
  if(id) fb(`exams/${id}`, 'PATCH', {lastUsed:Date.now()}).catch(()=>{});

  const mk=t=>({id:rid(4),type:t,text:'',img:'',points:1,...(t==='mcq'?{options:['',''],correct:0}:t==='multi'?{options:['',''],correct:[]}:t==='tf'?{correct:0}:t==='short'?{correct:''}:{})});

  const parseStudentFile = async (file) => {
    try{
      const ext = file.name.split('.').pop().toLowerCase();
      let extracted = [];
      if(ext === 'xlsx' || ext === 'xls' || ext === 'csv'){
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        rows.forEach((r, idx) => {
          if(!r || !r.length) return;
          const cells = r.map(c => String(c||'').trim()).filter(Boolean);
          if(!cells.length) return;
          if(idx === 0 && /اسم|الرقم|جلوس|كود|name|id/i.test(cells.join(' '))) return;
          if(cells.length >= 2){
            const isFirstNum = /^[\d٠-٩]+$/.test(cells[0]);
            extracted.push({sid: isFirstNum ? cells[0] : cells[1], name: isFirstNum ? cells[1] : cells[0]});
          } else {
            extracted.push({sid: cells[0], name: ''});
          }
        });
      } else if(ext === 'docx'){
        const buf = await file.arrayBuffer();
        const res = await mammoth.extractRawText({arrayBuffer: buf});
        const lines = res.value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
        lines.forEach((line, idx) => {
          if(idx === 0 && /اسم|الرقم|جلوس|كود|name|id/i.test(line)) return;
          const parts = line.split(/[\t,\-|،]+/).map(p=>p.trim()).filter(Boolean);
          if(parts.length >= 2){
            const isFirstNum = /^[\d٠-٩]+$/.test(parts[0]);
            extracted.push({sid: isFirstNum ? parts[0] : parts[1], name: isFirstNum ? parts[1] : parts[0]});
          } else {
            const numMatch = line.match(/[\d٠-٩]{2,}/);
            if(numMatch) extracted.push({sid: numMatch[0], name: line.replace(numMatch[0],'').trim()});
            else extracted.push({sid: line, name: ''});
          }
        });
      } else {
        return toast('صيغة غير مدعومة. ارفع ملف Excel (.xlsx / .csv) أو Word (.docx)');
      }
      extracted = extracted.filter(x => x.sid || x.name);
      if(!extracted.length) return toast('لم يتم العثور على بيانات طلاب داخل الملف');
      M.allowedList = extracted;
      toast(`تم استيراد ${extracted.length} طالب بنجاح!`);
      draw();
    }catch(err){ toast('خطأ في قراءة الملف: ' + err.message); }
  };

  const openBankModal = async () => {
    const bankObj = await fb(`qbank/${teacher.id}`) || {};
    const bankList = Object.values(bankObj);
    const m = document.createElement('div'); m.className='modal';
    m.innerHTML = `<div><div class="row between"><h2>📚 بنك الأسئلة الشخصي (${bankList.length})</h2><button class="btn sm" id="clB">✕</button></div>
      <p class="mut" style="margin-bottom:12px">اختر الأسئلة لإضافتها مباشرة إلى هذا الاختبار:</p>
      ${bankList.length ? bankList.map((bq,i)=>`<div class="qc row between">
        <div style="max-width:75%"><b>${esc(bq.text)}</b><div class="mut">${QT[bq.type]} | ${bq.points} درجة</div></div>
        <div class="row">
          <button class="btn pri sm" data-impb="${i}">＋ إضافة</button>
          <button class="btn bad sm" data-delb="${bq.id}">🗑️</button>
        </div>
      </div>`).join('') : '<p class="mut center" style="padding:20px">بنك الأسئلة فارغ حالياً. يمكنك حفظ أي سؤال بالضغط على زر (⭐ حفظ في البنك) بجانب السؤال.</p>'}
    </div>`;
    document.body.appendChild(m);
    $('#clB').onclick=()=>m.remove();
    m.querySelectorAll('[data-impb]').forEach(b=>b.onclick=()=>{
      const item = {...bankList[+b.dataset.impb], id:rid(4)};
      M.questions.push(item); toast('تم استيراد السؤال للاختبار'); m.remove(); draw();
    });
    m.querySelectorAll('[data-delb]').forEach(b=>b.onclick=async()=>{
      await fb(`qbank/${teacher.id}/${b.dataset.delb}`, 'DELETE'); toast('تم الحذف من البنك'); m.remove(); openBankModal();
    });
  };

  const draw=()=>{
    show(`<div class="row between" style="margin-bottom:12px"><h1>${id?'✏️ تعديل الاختبار':'🆕 إنشاء اختبار جديد'}</h1><button class="btn" id="bk">→ رجوع</button></div>
    <div class="card"><label>عنوان الاختبار</label><input data-f="title" value="${esc(M.title)}" placeholder="مثال: اختبار منتصف الفصل - نظم التشغيل"><label>تعليمات للطلاب (اختياري)</label><textarea data-f="desc" style="min-height:60px">${esc(M.desc)}</textarea>
      <div class="grid3">
        <div style="margin-top:8px"><label>المدة الكلية للاختبار (دقائق)</label><input type="number" min="1" data-f="duration" value="${M.duration}"></div>
        <div style="margin-top:8px"><label>مؤقت مستقل لكل سؤال (اختياري)</label><select data-f="qTimer">${[[0,'بدون مؤقت للسؤال (حر)'],[20,'20 ثانية لكل سؤال'],[30,'30 ثانية لكل سؤال'],[45,'45 ثانية لكل سؤال'],[60,'دقيقة واحدة لكل سؤال'],[90,'90 ثانية لكل سؤال']].map(o=>`<option value="${o[0]}" ${(M.qTimer||0)==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
        <div style="margin-top:8px"><label>تغيّر كود الدخول تلقائياً كل</label><select data-f="rotate">${[[0,'ثابت (يغيّره المعلم يدوياً)'],[30,'30 ثانية'],[45,'45 ثانية'],[60,'دقيقة واحدة'],[120,'دقيقتان']].map(o=>`<option value="${o[0]}" ${M.rotate==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
      </div>
      <div class="row" style="margin-top:14px">${[['shuffleQ','ترتيب عشوائي للأسئلة'],['shuffleO','ترتيب عشوائي للخيارات'],['allowBack','السماح بالرجوع للأسئلة السابقة'],['showScore','إظهار الدرجة وشهادة الاجتياز للطالب']].map(c=>`<label class="row" style="margin:0;cursor:pointer"><input type="checkbox" style="width:auto;margin:0" data-f="${c[0]}" ${M[c[0]]?'checked':''}> ${c[1]}</label>`).join('')}</div>
      
      <div class="wl-box">
        <label class="row" style="margin:0;cursor:pointer;color:#15803d;font-size:14px">
          <input type="checkbox" style="width:auto;margin:0" data-f="restrictStudents" ${M.restrictStudents?'checked':''}>
          🔒 تقييد الدخول بقائمة طلاب محددة (اختياري — يمنع دخول أي طالب غير مدرج بالكشف)
        </label>
        ${M.restrictStudents ? `<div style="margin-top:12px">
          <p class="mut" style="font-size:13px;margin-bottom:8px">ارفع ملف <b>Excel (.xlsx / .csv)</b> أو <b>Word (.docx)</b> يحتوي على عمودين: (اسم الطالب) و(الرقم الجامعي / رقم الجلوس):</p>
          <div class="row">
            <label class="btn ok sm" style="margin:0;cursor:pointer">📂 اختيار ملف Excel أو Word<input type="file" id="wlFile" accept=".xlsx,.xls,.csv,.docx" style="display:none"></label>
            ${M.allowedList.length ? `<span class="badge b-ok">✔ تم تحميل ${M.allowedList.length} طالب</span> <button class="btn bad sm" id="clrWl">مسح القائمة</button>` : '<span class="badge b-warn">لم يتم رفع ملف طلاب بعد</span>'}
          </div>
          ${M.allowedList.length ? `<div style="max-height:140px;overflow:auto;margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:12.5px">
            ${M.allowedList.slice(0,30).map((s,idx)=>`<div style="padding:3px 6px;border-bottom:1px solid var(--bd)">${idx+1}. <b>${esc(s.name||'بدون اسم')}</b> — الرقم: <code>${esc(s.sid)}</code></div>`).join('')}
            ${M.allowedList.length>30?`<div class="mut center" style="padding:4px">... و ${M.allowedList.length-30} طالب آخر</div>`:''}
          </div>` : ''}
        </div>` : ''}
      </div>
    </div>
    ${M.questions.map((q,i)=>qCard(q,i)).join('')}
    <div class="card row between">
      <div><b>＋ إضافة سؤال جديد:</b><div class="row" style="margin-top:10px">${Object.entries(QT).map(([k,v])=>`<button class="btn sm" data-add="${k}">${v}</button>`).join('')}</div></div>
      <button class="btn pri sm" id="opBank">📚 استيراد من بنك الأسئلة</button>
    </div>
    <button class="btn pri" id="sv" style="width:100%;font-size:18px;padding:14px">💾 حفظ الاختبار</button>`, 'teacher');
    
    $('#bk').onclick=dash;
    $('#opBank').onclick=openBankModal;
    if($('#wlFile')) $('#wlFile').onchange = e => { if(e.target.files[0]) parseStudentFile(e.target.files[0]); };
    if($('#clrWl')) $('#clrWl').onclick = () => { M.allowedList = []; draw(); };
    $('#sv').onclick=async()=>{
      try{
        if(!M.title.trim()) throw new Error('اكتب عنوان الاختبار');
        if(!M.questions.length) throw new Error('أضف سؤالاً واحداً على الأقل');
        if(M.restrictStudents && !M.allowedList.length) throw new Error('فعّلت خيار تقييد الدخول، يرجى رفع ملف Excel أو Word بأسماء وأرقام الطلاب أولاً');
        const eid = id || rid(6);
        const now = Date.now();
        const data = {...M, id:eid, owner:teacher.id, open:M.open||false, created:M.created||now, lastUsed:now};
        await fb(`exams/${eid}`, 'PUT', data);
        toast('تم حفظ الاختبار بنجاح');dash();
      }catch(e){toast(e.message)}
    };
  };
  const qCard=(q,i)=>{
    let ed='';
    if(q.type==='mcq'||q.type==='multi')ed=q.options.map((o,k)=>`<div class="row" style="margin:6px 0;flex-wrap:nowrap"><input type="${q.type==='mcq'?'radio':'checkbox'}" name="c${i}" style="width:auto;margin:0" data-ok="${i}:${k}" ${(q.type==='mcq'?q.correct===k:q.correct.includes(k))?'checked':''}><input data-op="${i}:${k}" value="${esc(o)}" placeholder="الخيار ${k+1}">${q.options.length>2?`<button class="btn bad sm" data-ro="${i}:${k}">✕</button>`:''}</div>`).join('')+`<button class="btn sm" data-ao="${i}">＋ إضافة خيار</button>`;
    if(q.type==='tf')ed=`<div class="row" style="margin-top:8px">${['صح','خطأ'].map((l,k)=>`<label class="row" style="margin:0"><input type="radio" name="tf${i}" style="width:auto;margin:0" data-ok="${i}:${k}" ${q.correct===k?'checked':''}> ${l}</label>`).join('')}</div>`;
    if(q.type==='short')ed=`<label>الإجابة النموذجية الصحيحة</label><input data-sh="${i}" value="${esc(q.correct)}">`;
    return `<div class="qc"><div class="row between"><b>سؤال ${i+1} <span class="badge b-info">${QT[q.type]}</span></b><div class="row"><label style="margin:0">الدرجة</label><input type="number" min="1" style="width:68px;margin:0" data-pt="${i}" value="${q.points}"><button class="btn sm" data-svb="${i}" title="حفظ في بنك الأسئلة">⭐ حفظ بالبنك</button>${i?`<button class="btn sm" data-mv="${i}:-1">↑</button>`:''}${i<M.questions.length-1?`<button class="btn sm" data-mv="${i}:1">↓</button>`:''}<button class="btn bad sm" data-dq="${i}">حذف</button></div></div>
    <textarea data-qt="${i}" placeholder="اكتب نص السؤال هنا..." style="min-height:60px">${esc(q.text)}</textarea>
    <input data-qi="${i}" value="${esc(q.img||'')}" placeholder="🖼️ رابط صورة توضيحية للسؤال (اختياري)..." style="font-size:13px;padding:8px 12px">
    ${ed}</div>`;
  };
  app.oninput=e=>{const d=e.target.dataset;if(d.f&&e.target.type!=='checkbox')M[d.f]=['duration','rotate','qTimer'].includes(d.f)?+e.target.value:e.target.value;if(d.qt!==undefined)M.questions[d.qt].text=e.target.value;if(d.qi!==undefined)M.questions[d.qi].img=e.target.value;if(d.pt!==undefined)M.questions[d.pt].points=+e.target.value||1;if(d.sh!==undefined)M.questions[d.sh].correct=e.target.value;if(d.op){const[i,k]=d.op.split(':');M.questions[i].options[k]=e.target.value}};
  app.onchange=e=>{const d=e.target.dataset;if(d.f&&e.target.type==='checkbox'){M[d.f]=e.target.checked;if(d.f==='restrictStudents')draw();}if(d.ok){const[i,k]=d.ok.split(':').map(Number),q=M.questions[i];if(q.type==='multi'){q.correct=e.target.checked?[...new Set([...q.correct,k])]:q.correct.filter(x=>x!==k)}else q.correct=k}};
  app.onclick=async e=>{const d=e.target.dataset;
    if(d.add){M.questions.push(mk(d.add));draw()}
    if(d.ao!==undefined){M.questions[d.ao].options.push('');draw()}
    if(d.ro){const[i,k]=d.ro.split(':').map(Number),q=M.questions[i];q.options.splice(k,1);if(q.type==='mcq'&&q.correct>=q.options.length)q.correct=0;draw()}
    if(d.dq!==undefined){M.questions.splice(+d.dq,1);draw()}
    if(d.mv){const[i,s]=d.mv.split(':').map(Number);[M.questions[i],M.questions[i+s]]=[M.questions[i+s],M.questions[i]];draw()}
    if(d.svb!==undefined){const q=M.questions[+d.svb];if(!q.text.trim())return toast('اكتب نص السؤال أولاً');const bid=rid(6);await fb(`qbank/${teacher.id}/${bid}`,'PUT',{...q,id:bid});toast('⭐ تم حفظ السؤال في بنك الأسئلة الشخصي');}
  };
  draw();
}

/* ============== الجلسة الحية ============== */
async function live(id){
  clearLoops();
  let ex = await fb(`exams/${id}`);
  await fb(`exams/${id}`, 'PATCH', {lastUsed:Date.now()}).catch(()=>{});
  const rot = async() => {
    const code = String(Math.floor(100000+Math.random()*900000));
    await fb(`exams/${id}`, 'PATCH', {code, open:true, codeAt:Date.now(), lastUsed:Date.now()});
    ex.code = code; ex.open = true; draw();
  };
  const draw = () => {
    const u = `${location.origin}${location.pathname}?c=${ex.code||''}`;
    show(`<div class="row between" style="margin-bottom:12px"><h1>📡 الجلسة الحية: ${esc(ex.title)}</h1><div class="row"><button class="btn" onclick="results('${id}')">📊 الإحصائيات</button><button class="btn" id="bk">→ رجوع</button></div></div>
    <div class="card center"><span class="badge ${ex.open?'b-ok':'b-bad'}">${ex.open?'الاختبار مفتوح للطلاب الآن':'الاختبار مغلق'}</span>
      ${ex.restrictStudents?` <span class="badge b-purp">🔒 الدخول مقيّد بالكشف (${(ex.allowedList||[]).length} طالب)</span>`:''}
      ${ex.open?`<div class="codebox">${ex.code}</div><div class="qrbox"><div id="qr"></div></div><p class="mut" style="margin-top:8px">كود الدخول يتغير تلقائياً لمنع مشاركته خارج القاعة</p>${ex.rotate>0?'<div class="bar" style="max-width:340px;margin:12px auto"><div id="rb"></div></div>':''}`:'<p class="mut" style="margin:20px">اضغط "فتح الاختبار" لتوليد كود الدخول ورمز QR</p>'}
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn ${ex.open?'bad':'ok'}" id="tg">${ex.open?'🔒 إغلاق الدخول':'🔓 فتح الاختبار'}</button>
        ${ex.open?'<button class="btn pri" id="nw">🔄 توليد كود جديد فوراً</button>':''}
      </div></div>
    <div class="card"><h2>👥 الطلاب الحاضرون في الجلسة (<span id="cnt">0</span>)</h2><div class="table-wrap" id="st"></div></div>`, 'teacher');
    $('#bk').onclick=dash;
    $('#tg').onclick=async()=>{
      if(ex.open){ await fb(`exams/${id}`,'PATCH',{open:false}); ex.open=false; clearLoops(); draw(); }
      else { await rot(); startTimers(); }
    };
    if($('#nw')) $('#nw').onclick=rot;
    if(ex.open && $('#qr')) new QRCode($('#qr'),{text:u,width:165,height:165});
  };
  const poll = async() => {
    const atts = Object.values(await fb(`attempts/${id}`) || {});
    if($('#cnt')) $('#cnt').textContent = atts.length;
    if($('#st')) $('#st').innerHTML = atts.length ? `<table><tr><th>الطالب</th><th>الرقم الجامعي</th><th>الحالة</th><th>الدرجة</th></tr>${atts.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.sid)}</td><td><span class="badge ${a.status==='submitted'?'b-ok':a.status==='locked'?'b-bad':'b-info'}">${a.status==='submitted'?'تم التسليم':a.status==='locked'?'مقفل (مخالفة)':'يؤدي الاختبار'}</span></td><td>${a.score??'-'} / ${a.total}</td></tr>`).join('')}</table>` : '<p class="mut">بانتظار دخول الطلاب...</p>';
  };
  const startTimers = () => {
    clearLoops();
    if(ex.open && ex.rotate>0){
      let left = ex.rotate;
      loops.push(setInterval(()=>{
        left--; if($('#rb')) $('#rb').style.width=(left/ex.rotate*100)+'%';
        if(left<=0){ left=ex.rotate; rot(); }
      },1000));
    }
    loops.push(setInterval(poll, 3500));
  };
  if(ex.open && !ex.code) await rot(); else draw();
  poll(); startTimers();
}

/* ============== لوحة الإحصائيات والنتائج + المخطط الدائري + الغائبون ============== */
async function results(id){
  clearLoops();
  const ex = await fb(`exams/${id}`);
  await fb(`exams/${id}`, 'PATCH', {lastUsed:Date.now()}).catch(()=>{});
  const atts = Object.values(await fb(`attempts/${id}`) || {});
  const qs = ex.questions || [];
  const totalPts = qs.reduce((s,q)=>s+(+q.points||1), 0);

  const submittedAtts = atts.filter(a => a.status === 'submitted');
  const scoredAtts = atts.filter(a => a.status === 'submitted' || a.status === 'locked');
  const scores = scoredAtts.map(a => Number(a.score ?? 0)).sort((a,b) => a - b);
  const count = scores.length;
  const mean = count ? (scores.reduce((a,b)=>a+b,0) / count).toFixed(2) : 0;
  const median = count ? (count%2 ? scores[Math.floor(count/2)] : ((scores[count/2-1]+scores[count/2])/2).toFixed(1)) : 0;
  const minS = count ? scores[0] : 0;
  const maxS = count ? scores[count-1] : 0;

  const freq = {};
  scores.forEach(s => freq[s] = (freq[s]||0) + 1);
  let modeVal = '-', maxFreq = 0;
  Object.entries(freq).forEach(([k,v]) => { if(v > maxFreq){ maxFreq = v; modeVal = `${k} (${v} طلاب)`; } });

  const getDuration = a => (a.finishedAt && a.startedAt) ? (a.finishedAt - a.startedAt) : (a.finishedAt || Infinity);
  const fmtDur = a => (a.finishedAt && a.startedAt) ? ` - ${Math.max(1, Math.round((a.finishedAt - a.startedAt)/1000))} ث` : '';

  const ranked = [...submittedAtts].sort((a,b) => (Number(b.score??0) - Number(a.score??0)) || (getDuration(a) - getDuration(b)));
  const firstStudent = ranked[0] ? `${ranked[0].name} (${Number(ranked[0].score??0)}/${totalPts}${fmtDur(ranked[0])})` : 'لا يوجد';
  const lowestRanked = [...scoredAtts].sort((a,b) => (Number(a.score??0) - Number(b.score??0)) || (getDuration(b) - getDuration(a)));
  const lastStudent = lowestRanked[0] ? `${lowestRanked[0].name} (${Number(lowestRanked[0].score??0)}/${totalPts})` : 'لا يوجد';

  // حساب توزيع التقديرات للمخطط الدائري
  const gDist = {ممتاز:0, 'جيد جداً':0, جيد:0, مقبول:0, ضعيف:0};
  scoredAtts.forEach(a => { const gi = getGradeInfo(a.score||0, a.total||totalPts); gDist[gi.grade]++; });
  const totG = Math.max(count, 1);
  const p1 = (gDist['ممتاز']/totG)*100, p2 = p1+(gDist['جيد جداً']/totG)*100, p3 = p2+(gDist['جيد']/totG)*100, p4 = p3+(gDist['مقبول']/totG)*100;
  const donutGrad = count ? `conic-gradient(#10b981 0% ${p1}%, #0ea5e9 ${p1}% ${p2}%, #8b5cf6 ${p2}% ${p3}%, #f59e0b ${p3}% ${p4}%, #ef4444 ${p4}% 100%)` : 'conic-gradient(#cbd5e1 0% 100%)';

  // حساب الغائبين (في حال تفعيل قائمة الطلاب)
  let absentees = [];
  if(ex.restrictStudents && Array.isArray(ex.allowedList)){
    const attendedSids = new Set(atts.map(a => normSid(a.sid)));
    absentees = ex.allowedList.filter(item => item.sid && !attendedSids.has(normSid(item.sid)));
  }

  const qStats = qs.map((q) => {
    let correctCount = 0;
    scoredAtts.forEach(a => {
      const g = a.graded?.[q.id];
      if(g !== undefined && g >= q.points) correctCount++;
    });
    return {text: q.text, correctCount, total: count, ratio: count ? Math.round((correctCount/count)*100) : 0};
  });
  const hardQuestions = qStats.filter(q => count > 0 && q.ratio < 60).sort((a,b) => a.ratio - b.ratio);
  const maxBar = Math.max(...Object.values(freq), 1);

/* ============== بوابة الطالب والحماية + خريطة الأسئلة + المؤقت الدائري + الشهادة ============== */
function sJoin(pc=''){
  clearLoops();
  show(`<div style="max-width:450px;margin:2vh auto"><div class="card">
    <h2 class="center" style="margin-top:4px">🎓 دخول الاختبار — Itqan</h2>
    <div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:12px;padding:12px;margin:12px 0;font-size:13px;color:#92400e;font-weight:700">⚠️ تنبيه: يمنع تبديل التبويبات أو تصوير الشاشة أو سحب شريط الإشعارات أثناء الاختبار، وسيتم قفل المحاولة فوراً عند المخالفة.</div>
    <label>كود الدخول (6 أرقام)</label><input id="cd" dir="ltr" maxlength="6" style="font-size:24px;text-align:center;letter-spacing:.2em;font-weight:800" value="${esc(pc)}">
    <label>اسم الطالب الثلاثي</label><input id="nm" placeholder="اكتب اسمك الكامل">
    <label>الرقم الجامعي / رقم الجلوس</label><input id="si" dir="ltr" placeholder="2026001">
    <button class="btn pri" id="st" style="width:100%;margin-top:16px;padding:13px">🚀 بدء الاختبار الآن</button></div></div>`, 'student');
  $('#st').onclick=async()=>{
    try{
      const code=$('#cd').value.trim(), name=$('#nm').value.trim(), sid=$('#si').value.trim();
      if(!code||!name||!sid) return toast('أكمل جميع البيانات أولاً');
      const all = await fb('exams') || {};
      const ex = Object.values(all).find(x => x && x.open && String(x.code) === code);
      if(!ex) return toast('كود الدخول غير صحيح أو انتهت صلاحيته');

      if(ex.restrictStudents && Array.isArray(ex.allowedList) && ex.allowedList.length > 0){
        const sNorm = normSid(sid);
        const nNorm = name.trim().replace(/\s+/g,' ');
        const found = ex.allowedList.find(item => {
          const itemSid = normSid(item.sid);
          const itemName = String(item.name||'').trim().replace(/\s+/g,' ');
          return (itemSid && itemSid === sNorm) || (itemName && itemName === nNorm && !itemSid);
        });
        if(!found){
          return toast('⛔ عذراً، اسمك أو رقمك غير مدرج في قائمة الطلاب المسموح لهم بدخول هذا الاختبار. راجع معلمك.');
        }
      }

      const atts = Object.values(await fb(`attempts/${ex.id}`) || {});
      let att = atts.find(a => a && normSid(a.sid) === normSid(sid));
      if(att && att.status === 'submitted') return toast('لقد قمت بتسليم هذا الاختبار مسبقاً');
      if(att && att.status === 'locked') return toast('تم قفل اختبارك بسبب مخالفة، راجع المعلم');
      if(!att){
        const qs = ex.shuffleQ ? shuffle(ex.questions) : ex.questions;
        const order = qs.map(q=>({id:q.id, opts:(q.type==='mcq'||q.type==='multi')?(ex.shuffleO?shuffle(q.options.map((_,i)=>i)):q.options.map((_,i)=>i)):null}));
        const total = ex.questions.reduce((s,q)=>s+(+q.points||1),0);
        const aid = rid(8);
        att = {id:aid, examId:ex.id, name, sid, status:'active', startedAt:Date.now(), answers:{}, total, order};
        await fb(`attempts/${ex.id}/${aid}`, 'PUT', att);
      }
      startExam(ex, att);
    }catch(e){toast(e.message)}
  };
}

function startExam(ex, att){
  clearLoops();
  const qMap = Object.fromEntries(ex.questions.map(q=>[q.id,q]));
  S = {ex, att, idx:0, ans:{...(att.answers||{})}, done:false, locked:false, fsOk:false, qLeft: ex.qTimer||0};
  document.documentElement.requestFullscreen?.().then(()=>S.fsOk=true).catch(()=>{});
  arm();
  const wm=document.createElement('div');wm.id='wm';
  wm.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='190'><text x='15' y='95' fill='rgba(15,23,42,0.06)' font-family='sans-serif' font-size='15' transform='rotate(-24 150 95)'>Itqan | ${att.name} - ${att.sid}</text></svg>`)}")`;
  document.body.appendChild(wm);

  const goQ = (newIdx) => {
    sync();
    S.idx = newIdx;
    S.qLeft = ex.qTimer || 0;
    render();
  };

  const render=()=>{
    document.body.classList.add('exam');
    const item = att.order[S.idx], q = qMap[item.id], a = S.ans[q.id];
    let inp='';
    if(q.type==='mcq'||q.type==='multi')inp=item.opts.map(oi=>`<button class="opt ${(q.type==='mcq'?a===oi:(a||[]).includes(oi))?'sel':''}" data-o="${oi}"><i>${q.type==='mcq'?'●':'✓'}</i><span>${esc(q.options[oi])}</span></button>`).join('');
    if(q.type==='tf')inp=[0,1].map(k=>`<button class="opt ${a===k?'sel':''}" data-o="${k}"><i>●</i><span>${k===0?'صح':'خطأ'}</span></button>`).join('');
    if(q.type==='short'||q.type==='essay')inp=`<textarea id="ta" placeholder="اكتب إجابتك هنا...">${esc(a||'')}</textarea>`;

    const navDots = att.order.map((it, i) => {
      const hasAns = S.ans[it.id] !== undefined && S.ans[it.id] !== '' && (!Array.isArray(S.ans[it.id]) || S.ans[it.id].length > 0);
      return `<button class="q-dot ${i===S.idx?'cur':hasAns?'ans':''}" ${ex.allowBack&&!ex.qTimer?`data-jump="${i}"`:'disabled'}>${i+1}</button>`;
    }).join('');

    app.innerHTML=`<div class="card">
      <div class="row between">
        <div><b>${esc(ex.title)}</b><div class="mut">${esc(att.name)} (${esc(att.sid)})</div></div>
        <div class="row">
          ${ex.qTimer>0?`<span class="badge b-warn" id="qtm" style="font-size:14px">⏱️ السؤال: ${S.qLeft}ث</span>`:''}
          <div class="timer-ring" id="tmRing" style="background:conic-gradient(#4f46e5 100%, var(--bd) 0%)"><span id="tm">--:--</span></div>
        </div>
      </div>
      <div class="q-nav">${navDots}</div>
    </div>
    <div class="card">
      <div class="row between"><span class="badge b-info">سؤال ${S.idx+1} من ${att.order.length}</span><span class="badge b-warn">${q.points} درجة</span></div>
      ${q.img?`<div class="center" style="margin-top:12px"><img src="${esc(q.img)}" style="max-width:100%;max-height:260px;border-radius:14px;border:1px solid var(--bd)"></div>`:''}
      <h2 style="margin:14px 0">${esc(q.text)}</h2>${inp}
      <div class="row between" style="margin-top:18px">
        ${ex.allowBack&&!ex.qTimer&&S.idx>0?'<button class="btn" id="pv">→ السابق</button>':'<span></span>'}
        ${S.idx<att.order.length-1?'<button class="btn pri" id="nx">التالي ←</button>':'<button class="btn ok" id="sb">✔ تسليم الاختبار</button>'}
      </div>
    </div>`;

    app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const v=+b.dataset.o;if(q.type==='multi'){const c=new Set(S.ans[q.id]||[]);c.has(v)?c.delete(v):c.add(v);S.ans[q.id]=[...c]}else S.ans[q.id]=v;sync();render()});
    app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>goQ(+b.dataset.jump));
    if($('#ta'))$('#ta').oninput=e=>{S.ans[q.id]=e.target.value};
    if($('#pv'))$('#pv').onclick=()=>goQ(S.idx-1);
    if($('#nx'))$('#nx').onclick=()=>goQ(S.idx+1);
    if($('#sb'))$('#sb').onclick=()=>{if(confirm('هل أنت متأكد من تسليم إجاباتك نهائياً؟'))submit()};
  };
  const sync = () => fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {answers:S.ans}).catch(()=>{});
  const totalSec = ex.duration * 60;
  const endAt = att.startedAt + totalSec * 1000;

  const tick = () => {
    const left = Math.max(0, Math.floor((endAt - Date.now()) / 1000));
    const el = $('#tm'), ring = $('#tmRing');
    if(el && ring){
      el.textContent = fmtTime(left);
      const pct = Math.max(0, Math.min(100, (left / totalSec) * 100));
      const clr = left < 60 ? '#ef4444' : pct < 30 ? '#f59e0b' : '#4f46e5';
      ring.style.background = `conic-gradient(${clr} ${pct}%, var(--bd) ${pct}%)`;
      ring.classList.toggle('low', left < 60);
    }
    if(ex.qTimer > 0 && !S.done){
      S.qLeft--;
      const qel = $('#qtm'); if(qel) qel.textContent = `⏱️ السؤال: ${Math.max(0,S.qLeft)}ث`;
      if(S.qLeft <= 0){
        if(S.idx < att.order.length - 1) goQ(S.idx + 1);
        else submit();
        return;
      }
    }
    if(left <= 0 && !S.done) submit();
  };
  render(); tick(); loops.push(setInterval(tick,1000));
}

async function submit(){
  if(!S||S.done)return; S.done=true; clearLoops();
  const {ex, att, ans} = S;
  let score = 0; const graded = {};
  ex.questions.forEach(q => {
    const a = ans[q.id]; let g = 0;
    if(q.type==='mcq'||q.type==='tf'){ if(a===q.correct) g = q.points; }
    else if(q.type==='multi'){ const c=[...(q.correct||[])].sort().join(','), u=[...(a||[])].sort().join(','); if(c&&c===u) g = q.points; }
    else if(q.type==='short'){ if(String(a||'').trim().toLowerCase()===String(q.correct||'').trim().toLowerCase()) g = q.points; }
    graded[q.id] = g; score += g;
  });
  await fb(`attempts/${ex.id}/${att.id}`, 'PATCH', {answers:ans, status:'submitted', finishedAt:Date.now(), score, graded});
  end('submitted', score, att.total);
}

function downloadCertificate(stName, sid, exTitle, sc, tot, gi){
  const w = window.open('', '_blank', 'width=900,height=650');
  const today = new Date().toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>شهادة اجتياز - ${esc(stName)}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
  <style>body{font-family:'Cairo',sans-serif;background:#f1f5f9;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
  .cert{width:820px;background:#fff;border:12px double #1e3a8a;border-radius:24px;padding:42px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.1)}
  h1{color:#1e3a8a;font-size:32px;margin:8px 0}h2{color:#0ea5e9;font-size:26px;margin:14px 0}
  .box{background:#f8fafc;border:1px solid #cbd5e1;border-radius:14px;padding:16px;margin:20px auto;max-width:520px;font-size:18px}
  @media print{body{background:#fff}.no-p{display:none}}</style></head>
  <body><div class="cert">
    <div style="font-size:18px;font-weight:800;color:#4f46e5">منصة Itqan | إتقان للاختبارات الرقمية الذكية والآمنة</div>
    <h1>🏅 شهادة اجتياز وتفوق</h1>
    <p style="font-size:17px;color:#475569">تشهد إدارة المنصة بأن الطالب / الطالبة:</p>
    <h2>${esc(stName)}</h2>
    <p style="font-size:15px;color:#64748b">الرقم الجامعي / الجلوس: <b>${esc(sid)}</b></p>
    <p style="font-size:17px;margin-top:14px">قد اجتاز بنجاح اختبار: <b>«${esc(exTitle)}»</b></p>
    <div class="box">الدرجة المستحقة: <b>${sc} من ${tot}</b> (${gi.pct}%) — التقدير العام: <b style="color:#15803d">${gi.grade}</b></div>
    <p style="font-size:14px;color:#64748b;margin-top:24px">تاريخ الإصدار: ${today} | نظام التقييم الآمن — إتقان</p>
    <button class="no-p" onclick="window.print()" style="margin-top:18px;padding:10px 24px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:15px;cursor:pointer">🖨️ طباعة أو حفظ PDF</button>
  </div></body></html>`);
  w.document.close();
}

function end(st, sc, tot){
  clearLoops(); document.exitFullscreen?.().catch(()=>{});
  const gi = getGradeInfo(sc||0, tot||1);
  if(st==='submitted' && gi.status==='ناجح' && typeof confetti==='function'){
    confetti({particleCount:90, spread:70, origin:{y:0.6}});
  }
  show(`<div class="card center" style="max-width:500px;margin:4vh auto;padding:30px">
    <div class="big">${st==='submitted'?'🎉':'🚫'}</div>
    <h2>${st==='submitted'?'تم تسليم الاختبار بنجاح':'تم قفل الاختبار بسبب مخالفة'}</h2>
    <p class="mut" style="margin:10px 0">${st==='submitted'?'تم حفظ إجاباتك في سجل المعلم بنجاح.':'تم رصد محاولة خروج أو تصوير للشاشة وإبلاغ المعلم فوراً.'}</p>
    ${st==='submitted'&&S.ex.showScore?`<div class="card-soft" style="margin-top:16px">
      <h3>درجتك: ${sc} من ${tot} (${gi.pct}%)</h3>
      <span class="badge ${gi.cls}" style="font-size:15px;margin-top:6px">التقدير: ${gi.grade} — ${gi.status}</span>
      ${gi.status==='ناجح'?`<div style="margin-top:14px"><button class="btn ok sm" id="certBtn">🏅 إصدار شهادة الاجتياز</button></div>`:''}
    </div>`:''}
    <button class="btn pri" style="margin-top:20px" onclick="home()">العودة للرئيسية</button>
  </div>`, 'home');
  if($('#certBtn')) $('#certBtn').onclick = () => downloadCertificate(S.att.name, S.att.sid, S.ex.title, sc, tot, gi);
}

async function violation(reason){
  if(!S||S.done||S.locked||Date.now()<S.armAt)return;
  S.locked=true;
  const u = `${FIREBASE_URL}/attempts/${S.ex.id}/${S.att.id}.json`;
  const payload = JSON.stringify({status:'locked', finishedAt:Date.now(), lastViolation:reason});
  try{ fetch(u, {method:'PATCH', body:payload, keepalive:true, headers:{'Content-Type':'application/json'}}); }catch{}
  fb(`attempts/${S.ex.id}/${S.att.id}/violations`, 'POST', {t:Date.now(), r:reason}).catch(()=>{});
  end('locked');
}

function arm(){
  const V=r=>violation(r);
  const blurOn=()=>{if(S&&!S.done)app.style.filter='blur(18px)'};
  const blurOff=()=>{if(S&&!S.done&&!S.locked)app.style.filter='none'};
  S.armAt=Date.now()+2500;
  let initW=window.innerWidth,initH=window.innerHeight,blurT=null;

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){blurOn();V('ترك الصفحة / تبديل التبويب')}
  });
  window.addEventListener('blur',()=>{
    if(!S||S.done||S.locked||Date.now()<S.armAt)return;
    blurOn();
    clearTimeout(blurT);
    blurT=setTimeout(()=>{
      if(document.hidden||!document.hasFocus()) V('فقدان التركيز / فتح نافذة خارجية');
      else blurOff();
    },1500);
  });
  window.addEventListener('focus',()=>{clearTimeout(blurT);blurOff()});
  window.addEventListener('resize',()=>{
    if(S&&!S.done&&Date.now()>S.armAt&&(Math.abs(window.innerWidth-initW)>140||Math.abs(window.innerHeight-initH)>180)){
      blurOn();V('محاولة تقسيم الشاشة أو تغيير حجم النافذة');
    }
  });
  window.addEventListener('pagehide',()=>V('إغلاق أو تحديث الصفحة'));
  window.addEventListener('beforeunload',e=>{if(S&&!S.done){e.preventDefault();e.returnValue=''}});
  document.addEventListener('fullscreenchange',()=>{
    if(S.fsOk&&!document.fullscreenElement){blurOn();V('الخروج من وضع ملء الشاشة')}
  });
  ['contextmenu','copy','cut','paste','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{if(S&&!S.done)e.preventDefault()}));
  document.addEventListener('keyup',e=>{
    if(e.key==='PrintScreen'||e.keyCode===44){blurOn();try{navigator.clipboard.writeText('')}catch{}V('محاولة تصوير الشاشة')}
  });
  document.addEventListener('keydown',e=>{
    if(!S||S.done)return;const k=e.key.toLowerCase();
    if(e.key==='PrintScreen'||e.keyCode===44||e.metaKey||e.key==='Meta'||e.key==='OS'){
      blurOn();try{navigator.clipboard.writeText('')}catch{}e.preventDefault();return V('محاولة تصوير الشاشة أو فتح قائمة النظام');
    }
    if(e.key==='F12'||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','s'].includes(k))||((e.ctrlKey||e.metaKey)&&['c','v','x','p','s','u','a','f'].includes(k))||(e.altKey&&k==='tab')){
      blurOn();e.preventDefault();V('محاولة استخدام اختصار محظور');
    }
  });
}

const params = new URLSearchParams(location.search);
if(params.get('admin') === 'itqan' && isRoot()) rootPanel();
else if(params.get('c')) sJoin(params.get('c'));
else home();
</script>
